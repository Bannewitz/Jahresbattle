<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Der Limes in 3D – interaktives Modell</title>
<style>
:root{--ink:#2b2418;--paper:#f6efdf;--paper2:#ebe0c6;--red:#a8382a;--gold:#c99a3d;--mut:#7a6f5c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#bfd8ea}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;background:#fffaf0ee;border:1px solid #c9b88f;color:var(--ink);font:600 12px/1.2 system-ui,sans-serif;padding:4px 8px;border-radius:999px;white-space:nowrap;cursor:pointer;box-shadow:0 2px 6px #0003}
.lbl:after{content:"";position:absolute;left:50%;bottom:-6px;width:1px;height:6px;background:#8a7a58}
.lbl.found{background:#e8f3df;border-color:#7aa35c}
.lbl.sel{background:var(--red);color:#fff;border-color:var(--red)}
.bar{position:fixed;left:12px;top:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
.bar > *{pointer-events:auto}
.title{background:#fffaf0ee;border:1px solid #c9b88f;border-radius:12px;padding:8px 14px;font-family:Georgia,serif;font-weight:700;font-size:1.15em;box-shadow:0 2px 10px #0002}
.title span{color:var(--red)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid #c9b88f;background:#fffaf0ee;padding:8px 12px;font-weight:600;color:var(--ink);box-shadow:0 2px 8px #0002}
button:hover{filter:brightness(.97)}
button.on{background:#f1e2b8}
button.primary{background:var(--red);color:#fff;border-color:var(--red);padding:10px 18px}
.grow{flex:1}
#legend{position:fixed;left:12px;bottom:12px;width:260px;max-height:calc(100vh - 90px);overflow:auto;background:#fffaf0f2;border:1px solid #c9b88f;border-radius:14px;padding:12px;box-shadow:0 4px 18px #0003;z-index:4}
.lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prog{font-size:.85em;color:var(--mut);font-weight:700}
.pbar{height:7px;background:#e6dcc6;border-radius:9px;overflow:hidden;margin-bottom:8px}
.pbar div{height:100%;background:linear-gradient(90deg,#7aa35c,#a6c46a);transition:width .4s}
.litems{display:flex;flex-direction:column;gap:4px}
.li{text-align:left;box-shadow:none;padding:6px 10px;font-weight:550;background:transparent;border-color:transparent}
.li.found{color:#3d6b2a}
.li.sel{background:#f1e2b8;border-color:#c9b88f}
#btnLegend{display:none}
#info{position:fixed;right:12px;top:70px;width:380px;max-height:calc(100vh - 84px);overflow:auto;background:linear-gradient(180deg,var(--paper),var(--paper2));border:1px solid #c9b88f;border-radius:16px;box-shadow:0 8px 30px #0004;z-index:6;transform:translateX(120%);transition:transform .35s cubic-bezier(.3,1.2,.5,1)}
#info.open{transform:none}
.ihead{display:flex;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.ihead h2{margin:.1em 0;font-family:Georgia,serif;font-size:1.5em}
.kicker{font-size:.75em;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:700}
.latin{color:var(--mut);font-size:.9em}
.x{box-shadow:none;background:transparent;border:0;font-size:1.2em;padding:4px 8px;height:fit-content}
.ibody{padding:0 18px 8px;line-height:1.55;font-size:1.02em}
.ibody p{margin:.5em 0}
.fact{background:#fff8e2;border:1px solid #e3cf98;border-left:4px solid var(--gold);border-radius:8px;padding:9px 12px;margin:10px 0 6px}
.inav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 18px 16px;font-size:.9em}
.inav button{padding:6px 10px;font-size:.9em}
.mut{color:var(--mut)}
.small{font-size:.85em}
#overview{position:fixed;inset:0;background:#1b160c88;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#overview.open{display:flex}
.ocard{max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,var(--paper),var(--paper2));border:1px solid #c9b88f;border-radius:16px;padding:22px 24px;box-shadow:0 10px 40px #0006;line-height:1.55}
.ocard h2{font-family:Georgia,serif;font-size:1.8em;margin:.1em 0 .3em}
.ocard .row{display:flex;justify-content:flex-end;margin-top:10px}
.ocard.center{text-align:center}
.ocard.center .row{justify-content:center}
.tip{background:#fff8e2;border:1px solid #e3cf98;border-radius:8px;padding:10px 12px}
@media (max-width:760px){
  #legend{display:none;left:8px;right:8px;width:auto;bottom:8px;max-height:55vh}
  #legend.open{display:block}
  #btnLegend{display:inline-block}
  #info{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:58vh;transform:translateY(120%)}
  #info.open{transform:none}
  .title{font-size:1em;padding:7px 10px}
  .bar button{padding:7px 9px;font-size:.88em}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<div class="bar">
  <div class="title">Der Limes <span>in 3D</span></div>
  <div class="grow"></div>
  <button id="btnInfo">ℹ️ <span class="hide-m">Über den Limes</span></button>
  <button id="btnLabels" class="on">🏷️ <span class="hide-m">Beschriftungen</span></button>
  <button id="btnHome">🏠 <span class="hide-m">Gesamtansicht</span></button>
  <button id="btnLegend">📋 Bauteile</button>
</div>
<div id="legend"></div>
<div id="info"></div>
<div id="overview"></div>
<noscript><p style="padding:20px">Bitte JavaScript aktivieren.</p></noscript>

<div class="kicker">Die Grenze des R\xF6mischen Reiches</div>
<h2>Der Limes</h2>
<p>Der <b>Obergermanisch-Raetische Limes</b> trennte das R\xF6mische Reich vom freien Germanien. Er verlief vom Rhein bis zur Donau \u2013 rund <b>550 Kilometer</b> lang. An ihm standen rund <b>900 Wacht\xFCrme</b> und etwa <b>120 gr\xF6\xDFere und kleinere Kastelle</b>.</p>
<p>Die R\xF6mer legten ihn ab etwa <b>100 n. Chr.</b> an und bauten ihn immer weiter aus. Um <b>260 n. Chr.</b> gaben sie ihn auf. Seit <b>2005</b> geh\xF6rt er zum UNESCO-Welterbe \u2013 er ist das gr\xF6\xDFte Bodendenkmal Deutschlands.</p>
<p class="tip">\u{1F446} <b>So geht's:</b> Mit einem Finger (oder der Maus) drehst du das Modell, mit zwei Fingern (oder dem Mausrad) zoomst du. <b>Tippe auf ein Bauteil</b>, um mehr dar\xFCber zu erfahren. Schaffst du es, alle Bauteile zu entdecken?</p>
<p class="mut small">Das Modell ist vereinfacht: In Wirklichkeit lagen die T\xFCrme Hunderte Meter auseinander, und die Kastelle standen oft weiter hinter der Grenze. Links siehst du den Limes in der Provinz Obergermanien (Palisade, Graben, Wall), rechts in der Provinz Raetien (Steinmauer).</p>`,kt=[{id:"palisade",short:"Palisade",kicker:"Obergermanien \xB7 ab etwa 120/130 n. Chr.",title:"Die Palisade",text:`<p>Unter Kaiser Hadrian (117\u2013138 n. Chr.) entstand ein durchgehender Zaun aus Holz: die <b>Palisade</b>. Sie bestand aus halbierten Baumst\xE4mmen, 40 bis 60 cm dick, die dicht an dicht im Boden steckten \u2013 bis zu 3 Meter hoch.</p>
      <p>Eine Armee konnte die Palisade nicht aufhalten. Aber sie zeigte deutlich: <b>Hier beginnt das R\xF6mische Reich.</b> Wer heimlich hin\xFCberwollte, kam nicht einfach so vorbei \u2013 und wurde von den T\xFCrmen aus leicht entdeckt.</p>`,fact:"Holz verrottet: Nach etwa 30 Jahren war eine Palisade morsch und musste ersetzt werden.",anchor:[-45,4.2,-8],cam:[-38,8,-26],look:[-40,1.5,-6]},{id:"graben",short:"Graben",kicker:"Obergermanien \xB7 Ende 2. Jh. n. Chr.",title:"Der Spitzgraben",text:`<p>Gegen Ende des 2. Jahrhunderts wurde die Grenze in Obergermanien verst\xE4rkt: Hinter der Palisade hoben die Soldaten einen <b>Graben</b> aus. Er lief unten spitz zu wie ein \u201EV\u201C \u2013 deshalb nennt man ihn <b>Spitzgraben</b>.</p>
      <p>F\xFCr Reiter, Wagen und Viehherden war er ein echtes Hindernis. Wer die Grenze \xFCberqueren wollte, sollte das nur an den bewachten Durchg\xE4ngen tun.</p>`,fact:"Die Erde aus dem Graben wurde gleich daneben zum Wall aufgesch\xFCttet. Forscher streiten \xFCbrigens dar\xFCber, ob Palisade, Graben und Wall wirklich gleichzeitig bestanden.",anchor:[-4,1.2,-5],cam:[5,14,11],look:[-9,-.8,-5]},{id:"wall",short:"Wall",kicker:"Obergermanien \xB7 Ende 2. Jh. n. Chr.",title:"Der Erdwall",text:`<p>Aus der Erde des Grabens sch\xFCtteten die Soldaten einen <b>Wall</b> auf. Graben und Wall zusammen machten es fast unm\xF6glich, die Grenze au\xDFerhalb der Tore mit Wagen oder Pferden zu \xFCberqueren.</p>
      <p>Hinter dem Wall lag der Weg der Soldaten und die Wacht\xFCrme.</p>`,fact:"An vielen Stellen im Wald kann man Wall und Graben heute noch als flache Bodenwelle erkennen \u2013 nach \xFCber 1.700 Jahren!",anchor:[-60,2.6,-.5],cam:[-56,7,13],look:[-58,1,-3]},{id:"mauer",short:"R\xE4tische Mauer",kicker:"Provinz Raetien \xB7 Ende 2./Anfang 3. Jh.",title:"Die R\xE4tische Mauer",latin:"",text:`<p>In der Provinz <b>Raetien</b> (heute vor allem Bayern und der Osten Baden-W\xFCrttembergs) ersetzten die R\xF6mer die Palisade durch eine <b>Steinmauer</b>: etwa <b>167 km lang</b>, 2,5 bis 3 Meter hoch und 1,2 Meter dick.</p>
      <p>Die Wacht\xFCrme wurden direkt in die Mauer eingebaut. Kalkstein gab es in der Gegend genug.</p>`,fact:"Im Volksmund hei\xDFt die Mauer \u201ETeufelsmauer\u201C \u2013 sp\xE4ter konnten sich die Menschen nicht erkl\xE4ren, wer so ein riesiges Bauwerk errichtet hatte.",anchor:[56,4.6,-6],cam:[56,9,-25],look:[53,1.5,-5]},{id:"holzturm",short:"Holzturm",kicker:"Die ersten Wacht\xFCrme \xB7 um 100 n. Chr.",title:"Der h\xF6lzerne Wachturm",text:`<p>Die ersten Wacht\xFCrme am Limes waren aus <b>Holz</b>. Sie standen im Abstand von wenigen hundert Metern bis zu zwei Kilometern \u2013 immer so, dass man den n\xE4chsten Turm sehen konnte.</p>
      <p>Die Soldaten beobachteten das Vorland. Sahen sie Gefahr, meldeten sie das vermutlich mit <b>Rauch- oder Feuerzeichen</b> von Turm zu Turm bis zum n\xE4chsten Kastell.</p>`,fact:"Holzt\xFCrme hielten nicht lange. Ab der Mitte des 2. Jahrhunderts wurden sie nach und nach durch Steint\xFCrme ersetzt.",anchor:[-52,10.4,2],cam:[-44,11,18],look:[-52,4,2]},{id:"steinturm",short:"Steinturm",kicker:"Rund 900 T\xFCrme am Limes",title:"Der steinerne Wachturm",text:`<p>Die Steint\xFCrme hatten meist <b>drei Stockwerke</b>: unten der Vorratsraum, im 1. Stock der Raum f\xFCr die Mannschaft, oben die Wachstube mit Ausblick. Bis zu <b>acht Soldaten</b> taten hier Dienst.</p>
      <p>Der Eingang lag im <b>1. Stock</b> und war nur \xFCber eine Leiter erreichbar \u2013 die konnte man bei Gefahr hochziehen.</p>`,fact:"Die T\xFCrme waren wei\xDF verputzt, mit rot aufgemalten Fugen. So sahen sie aus, als w\xE4ren sie aus perfekten Steinbl\xF6cken gebaut.",anchor:[-17,12.6,2.5],cam:[-8,12,19],look:[-17,5,2.5]},{id:"tor",short:"Durchgang",kicker:"Kontrollierte Grenze",title:"Der Durchgang (Limestor)",text:`<p>Der Limes war <b>keine geschlossene Grenze</b>. An Durchg\xE4ngen konnten Menschen und Waren hindurch \u2013 aber nur unter den Augen der Soldaten. H\xE4ndler brachten Felle, Vieh oder Bernstein und kauften r\xF6mische Waren.</p>
      <p>Der Limes war also vor allem ein Ort, an dem der <b>Verkehr von Menschen und Waren kontrolliert</b> wurde. F\xFCr Waren mussten H\xE4ndler wahrscheinlich Zoll zahlen.</p>`,fact:"R\xF6mische M\xFCnzen, Keramik und Glas hat man auch weit jenseits des Limes in germanischen Siedlungen gefunden.",anchor:[-25,5,-9],cam:[-13,8,-23],look:[-25,1.5,-7]},{id:"weg",short:"Patrouillenweg",kicker:"Hinter der Grenzlinie",title:"Der Patrouillenweg",text:"<p>Direkt hinter der Grenzlinie verlief ein <b>Weg</b>, auf dem Soldaten von Turm zu Turm gingen. So wurde der Grenzstreifen st\xE4ndig kontrolliert, und Nachrichten oder Nachschub kamen schnell zu den T\xFCrmen.</p>",fact:"Auf einer Strecke von rund 80 Kilometern verl\xE4uft der Limes schnurgerade \u2013 ohne Fernglas oder Laser vermessen!",anchor:[0,2,6.5],cam:[8,6,17],look:[-4,0,6]},{id:"kleinkastell",short:"Kleinkastell",kicker:"Kleine Befestigung an der Grenze",title:"Das Kleinkastell",text:"<p>Zwischen den Wacht\xFCrmen gab es kleine befestigte Lager f\xFCr eine <b>kleine Truppe</b>. Sie verst\xE4rkten die Bewachung, zum Beispiel an Stra\xDFen und Durchg\xE4ngen, und konnten schneller eingreifen als die Soldaten aus dem gro\xDFen Kastell.</p>",fact:"Kleinkastelle hatten meist nur ein einziges Tor \u2013 das machte sie leichter zu verteidigen.",anchor:[22,5,14],cam:[37,16,31],look:[22,1,14]},{id:"kastell",short:"Kastell",kicker:"Hinter dem Limes",title:"Das Kastell",latin:"castellum",text:`<p>Etwas hinter dem Limes lagen die <b>Kastelle</b>: befestigte Lager f\xFCr <b>Hilfstruppen</b> (keine Legion\xE4re!), oft f\xFCr etwa 500 Soldaten. Wurde Alarm gegeben, r\xFCckten von hier die Truppen aus.</p>
      <p>Aufbau: Mauer mit Graben, <b>vier Tore</b>, zwei Hauptstra\xDFen. In der Mitte das <b>Stabsgeb\xE4ude</b> (<i>principia</i>) mit dem Fahnenheiligtum, daneben das Haus des Kommandanten, Kornspeicher und lange <b>Mannschaftsbaracken</b>, in denen die Soldaten eng zusammen schliefen.</p>`,fact:"In Aalen lag das gr\xF6\xDFte Reiterkastell n\xF6rdlich der Alpen \u2013 dort waren rund 1.000 Reiter stationiert. Die Saalburg im Taunus ist heute als Kastell wieder aufgebaut und kann besucht werden.",anchor:[-25,9,40],cam:[-6,32,82],look:[-25,2,40]},{id:"strasse",short:"R\xF6merstra\xDFe",kicker:"Verbindung ins Hinterland",title:"Die R\xF6merstra\xDFe",text:"<p>Gut ausgebaute <b>Stra\xDFen</b> verbanden die Kastelle untereinander und mit den St\xE4dten im Hinterland. So konnten Truppen, Nachrichten und Waren schnell von Ort zu Ort gebracht werden.</p>",fact:"R\xF6mische Stra\xDFen hatten einen festen Unterbau aus mehreren Schichten Steine, Schotter und Kies \u2013 manche Wege folgen bis heute alten R\xF6merstra\xDFen.",anchor:[18,1.8,78],cam:[30,12,96],look:[12,0,78]},{id:"vicus",short:"Lagerdorf",kicker:"Leben neben dem Kastell",title:"Das Lagerdorf",latin:"vicus",text:`<p>Rund um jedes Kastell entstand ein <b>Dorf</b>. Hier lebten die Familien der Soldaten, H\xE4ndler, Handwerker und Wirte. Es gab L\xE4den, Werkst\xE4tten, Tempel und oft ein <b>Badehaus</b> (Therme) mit warmem und kaltem Wasser.</p>
      <p>Die Soldaten gaben hier ihren Sold aus \u2013 das Lagerdorf lebte vom Kastell.</p>`,fact:"R\xF6mische Soldaten durften lange offiziell nicht heiraten. Trotzdem hatten viele eine Familie im Lagerdorf.",anchor:[-30,6.4,84],cam:[-8,18,110],look:[-22,1,78]},{id:"germanen",short:"Germanen",kicker:"Jenseits des Limes",title:"Eine germanische Siedlung",text:`<p>Jenseits des Limes lebten <b>germanische St\xE4mme</b> in kleinen D\xF6rfern. Typisch war das <b>Langhaus</b>: Menschen und Vieh wohnten unter einem Dach \u2013 die Tiere w\xE4rmten im Winter mit.</p>
      <p>Die Germanen lebten von Ackerbau und Viehzucht. Mit den R\xF6mern gab es nicht nur Streit, sondern auch viel <b>Handel</b>.</p>`,fact:"Um 260 n. Chr. gaben die R\xF6mer den Limes auf \u2013 unter anderem wegen Angriffen germanischer Gruppen wie der Alamannen und wegen Krisen im R\xF6mischen Reich.",anchor:[-46,7.5,-42],cam:[-28,16,-15],look:[-46,1,-42]}];var Gi=document.getElementById("scene"),Gt;try{Gt=new Oo({antialias:!0})}catch(i){throw document.body.innerHTML='<div style="padding:30px;font-family:sans-serif;max-width:560px;margin:10vh auto;background:#fffaf0;border-radius:14px"><h2>3D wird nicht unterst\xFCtzt</h2><p>Dieses Ger\xE4t oder dieser Browser kann leider keine 3D-Grafik (WebGL) anzeigen. Bitte einen aktuellen Browser wie Chrome, Edge, Firefox oder Safari verwenden.</p></div>',i}Gt.setPixelRatio(Math.min(window.devicePixelRatio,2));Gt.shadowMap.enabled=!0;Gt.shadowMap.type=Xa;Gt.outputColorSpace=Bt;Gi.appendChild(Gt.domElement);var En=new Js;En.background=new qe(12572906);En.fog=new Zs(12572906,140,300);var nn=new Zt(45,1,.5,800),Xo={pos:new D(-12,78,112),target:new D(-8,0,12)};nn.position.copy(Xo.pos);var zn=new Go(nn,Gt.domElement);zn.target.copy(Xo.target);zn.enableDamping=!0;zn.maxPolarAngle=Math.PI*.47;zn.minDistance=8;zn.maxDistance=220;zn.update();En.add(new mr(14675967,5925690,1.1));var Cs=new xr(16773848,2.2);Cs.position.set(-60,90,50);Cs.castShadow=!0;Cs.shadow.mapSize.set(2048,2048);Object.assign(Cs.shadow.camera,{left:-110,right:110,top:100,bottom:-100,near:10,far:300});Cs.shadow.bias=-5e-4;En.add(Cs);function Si(i,e,t,n=[1,1]){let s=document.createElement("canvas");s.width=i,s.height=e,t(s.getContext("2d"),i,e);let r=new ds(s);return r.colorSpace=Bt,r.wrapS=r.wrapT=ss,r.repeat.set(...n),r.anisotropy=4,r}var st=(i,e)=>i+Math.random()*(e-i),D_={stone:()=>Si(256,128,(i,e,t)=>{i.fillStyle="#b9b2a3",i.fillRect(0,0,e,t);for(let n=0;n<t;n+=16)for(let s=n/16%2*16;s<e;s+=32)i.fillStyle=`hsl(40,${st(6,14)}%,${st(58,72)}%)`,i.fillRect(s+1,n+
