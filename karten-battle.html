<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karten-Battle</title>
<style>
:root{
  --bg:#0e1124; --bg2:#171b36; --card:#1e2346; --line:#2d3366; --txt:#eef0ff; --mut:#9aa0c8;
  --acc:#ff6b3d; --acc2:#ff3d7f; --gold:#ffc83d; --ok:#33d17a; --bad:#ff5a5a; --blue:#5aa9ff;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#2a1c4a 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#3a1a2c 0%,transparent 60%),var(--bg);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:.7em 1.2em;background:var(--card);border:1px solid var(--line);font-weight:650;transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.15)}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default;filter:none;transform:none}
.btn-main{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;box-shadow:0 6px 24px #ff3d7f44}
.btn-gold{background:var(--gold);color:#241a00;border:0}
.btn-ghost{background:transparent}
.btn-sm{padding:.4em .8em;font-size:.9em;border-radius:9px}
.btn-xl{font-size:1.35em;padding:.8em 1.6em;border-radius:16px}
input,select,textarea{background:#0b0e1f;border:1px solid var(--line);border-radius:10px;padding:.6em .8em;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical}
a{color:var(--blue)}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
.card{background:linear-gradient(180deg,#22284f,#1b2044);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1}
.mut{color:var(--mut)}
.small{font-size:.88em}
.center{text-align:center}
.hidden{display:none!important}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.15}
.logo{font-weight:900;letter-spacing:.02em;font-size:1.25em;display:flex;align-items:center;gap:.45em}
.logo .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 14px var(--acc2)}
.logo b{background:linear-gradient(90deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:#0e1124cc;backdrop-filter:blur(6px);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:.4em;padding:.3em .8em;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:650;font-size:.92em}
.codebadge{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;font-weight:800}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6vh}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero .card{padding:28px}
.title-xl{font-size:clamp(2rem,5vw,3.4rem);font-weight:900;line-height:1.05;margin:4vh 0 1vh}
.title-xl span{background:linear-gradient(90deg,var(--acc),var(--acc2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
/* editor */
.qlist{display:flex;flex-direction:column;gap:10px}
.qrow{display:grid;grid-template-columns:34px 130px 1fr auto;gap:10px;align-items:start;background:#151937;border:1px solid var(--line);border-radius:12px;padding:10px}
.qrow .num{font-weight:800;color:var(--mut);padding-top:.55em;text-align:center}
.qrow textarea{width:100%;min-height:2.6em}
.qrow .info{width:100%;margin-top:6px;font-size:.92em}
.qrow .yr{width:100%;font-weight:700}
.qrow .tools{display:flex;flex-direction:column;gap:6px}
.qrow .thumb{max-width:120px;max-height:70px;border-radius:6px;margin-top:6px;display:block}
@media (max-width:700px){.qrow{grid-template-columns:1fr}.qrow .num{text-align:left}.qrow .tools{flex-direction:row;flex-wrap:wrap}}
.yrbad{border-color:var(--bad)!important}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.settings label{display:flex;flex-direction:column;gap:6px;font-weight:650}
.settings label span{font-weight:400;color:var(--mut);font-size:.85em}
/* lobby */
.lobby{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:18px;margin-top:14px}
@media (max-width:860px){.lobby{grid-template-columns:1fr}}
.bigcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(2.6rem,6vw,4.4rem);font-weight:900;letter-spacing:.16em;text-align:center;color:var(--gold);text-shadow:0 0 30px #ffc83d55}
.qrbox{background:#fff;border-radius:14px;padding:10px;width:min(100%,300px);margin:8px auto}
.qrbox svg{display:block;width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:.38em .75em;border-radius:999px;background:#272d5c;border:1px solid var(--line);font-weight:650}
.chip.off{opacity:.45}
.chip.done{background:#1d4d35;border-color:#2f8a58}
.chip .x{background:none;border:0;padding:0 0 0 2px;color:var(--mut);font-size:1.05em;line-height:1}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* question */
.qnum{font-weight:800;color:var(--acc);letter-spacing:.08em;text-transform:uppercase;font-size:.95em}
.qtext{font-size:clamp(1.6rem,3.6vw,3rem);font-weight:850;line-height:1.15;margin:.2em 0 .3em}
.qimg{max-width:100%;max-height:48vh;border-radius:14px;display:block;margin:10px auto;box-shadow:0 10px 40px #0008}
.timer{font-size:2.2em;font-weight:900;font-variant-numeric:tabular-nums;min-width:2.4em;text-align:center}
.timer.low{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.progress{height:10px;background:#0b0e1f;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress > div{height:100%;background:linear-gradient(90deg,var(--ok),#9be15d);transition:width .3s}
/* timeline */
.tl{position:relative;margin:28px 8px 10px;padding-top:10px}
.tl-axis{position:relative;height:6px;background:linear-gradient(90deg,#3b4380,#6f78c4);border-radius:6px}
.tl-tick{position:absolute;top:14px;transform:translateX(-50%);font-size:.85em;color:var(--mut);white-space:nowrap}
.tl-tick:before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:10px;background:#6f78c4}
.tl-dots{position:relative;margin-bottom:8px}
.tl-dot{position:absolute;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--blue);border:2px solid #0e1124;box-shadow:0 0 0 1px #ffffff33;animation:drop .5s cubic-bezier(.3,1.6,.6,1) both}
.tl-dot.best{background:var(--gold)}
.tl-dot.hit{background:var(--ok)}
.tl-dot .rkn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72em;font-weight:900;color:#1b1400}
.tl-dot .lbl{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:.72em;font-weight:700;white-space:nowrap;background:#000a;padding:1px 5px;border-radius:5px;pointer-events:none}
@keyframes drop{from{transform:translate(-50%,-60px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.tl-answer{position:absolute;top:-6px;bottom:-34px;width:4px;margin-left:-2px;background:var(--gold);box-shadow:0 0 18px var(--gold);border-radius:3px;animation:grow .7s ease-out both}
.tl-answer .flag{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:var(--gold);color:#241a00;font-weight:900;padding:4px 10px;border-radius:8px;white-space:nowrap;font-size:1.1em}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.answerbig{font-size:clamp(2.6rem,7vw,5.5rem);font-weight:950;color:var(--gold);text-shadow:0 0 40px #ffc83d66;line-height:1;animation:zoom .6s cubic-bezier(.3,1.5,.6,1) both}
@keyframes zoom{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px;margin-top:12px}
.ritem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:#151937;border:1px solid var(--line)}
.ritem .rk{font-weight:900;width:2em;color:var(--mut)}
.ritem .nm{flex:1;min-width:4.5em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .g{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mut);font-size:.92em}
.ritem .p{font-weight:900;color:var(--ok);min-width:3.2em;text-align:right}
.ritem.top1{border-color:var(--gold);background:#3a3216}
.ritem.top2{border-color:#c9d1e8}
.ritem.top3{border-color:#d08a4f}
/* board */
.board{display:flex;flex-direction:column;gap:8px;max-width:820px;margin:0 auto}
.brow{display:grid;grid-template-columns:3em 1fr auto auto;gap:12px;align-items:center;padding:10px 16px;border-radius:12px;background:#171c3d;border:1px solid var(--line);font-size:1.15em;animation:slidein .35s ease-out both}
.brow .rk{font-weight:900;color:var(--mut)}
.brow .nm{font-weight:800}
.brow .delta{color:var(--ok);font-weight:800;font-size:.85em}
.brow .val{font-weight:900;font-variant-numeric:tabular-nums}
.brow.r1{background:linear-gradient(90deg,#4a3b10,#171c3d);border-color:var(--gold)}
.brow.r2{background:linear-gradient(90deg,#363b4d,#171c3d)}
.brow.r3{background:linear-gradient(90deg,#4a2f1c,#171c3d)}
@keyframes slidein{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.board.two{display:grid;grid-template-columns:1fr 1fr;max-width:1100px}
@media (max-width:800px){.board.two{grid-template-columns:1fr}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:30px 0 20px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(30%,220px)}
.pod .nm{font-weight:900;font-size:1.3em;text-align:center;word-break:break-word}
.pod .val{color:var(--mut);font-weight:700}
.pod .blk{width:100%;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:2.4em;font-weight:950;padding-top:10px;animation:rise .8s ease-out both}
.pod.p1 .blk{height:190px;background:linear-gradient(180deg,var(--gold),#b8860b);color:#241a00}
.pod.p2 .blk{height:140px;background:linear-gradient(180deg,#e1e6f5,#8d96b3);color:#1b1f33;animation-delay:.2s}
.pod.p3 .blk{height:105px;background:linear-gradient(180deg,#e09a5f,#8a4f22);color:#2a1505;animation-delay:.4s}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
/* player */
.pwrap{max-width:560px;margin:0 auto;padding:16px;overflow-x:hidden}
.pwrap .row > *{min-width:0}
.yinput{display:flex;gap:10px;align-items:stretch}
.yinput input{flex:1;min-width:0;width:100%;font-size:2.2em;font-weight:900;text-align:center;padding:.3em;font-variant-numeric:tabular-nums}
.era{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.era button{border:0;border-radius:0;background:#0b0e1f;padding:.5em .8em;font-size:.95em}
.era button.on{background:var(--acc);color:#fff}
.status{padding:.7em 1em;border-radius:12px;background:#151937;border:1px solid var(--line);text-align:center}
.status.ok{border-color:#2f8a58;background:#163a28}
.status.warn{border-color:#8a6a2f;background:#3a3016}
.status.err{border-color:#8a2f2f;background:#3a1616}
.bigrank{font-size:4em;font-weight:950;line-height:1;color:var(--gold)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#151937;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.6em}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000d;padding:.7em 1.2em;border-radius:12px;z-index:50;font-weight:650;animation:pop .2s}
.modal-bg{position:fixed;inset:0;background:#0009;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{max-width:520px;width:100%}
.spinner{width:34px;height:34px;border:4px solid #ffffff22;border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.foot{margin:30px 0 10px;font-size:.82em;color:var(--mut);text-align:center}
.tag{font-size:.75em;padding:.15em .55em;border-radius:6px;background:#2d3366;color:var(--mut);font-weight:700}

.qrow{grid-template-columns:34px 1fr auto}
.qrow .tools{flex-direction:column}
@media (max-width:700px){.qrow{grid-template-columns:1fr}.qrow .tools{flex-direction:row}}
.filebtn{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:.4em .8em;font-weight:650;display:inline-block;background:var(--card)}
.bad{color:var(--bad)}
.modal{max-height:94vh;overflow:auto}
.modal.wide{max-width:1000px}
.pwrap.wide{max-width:900px}
code{background:#0b0e1f;border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:.92em}
/* ---------- Fehlerjagd ---------- */
.fj-preview{background:#0b0e1f;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;line-height:1.7}
.fj-e{color:#ffb4a0;text-decoration:underline wavy var(--bad);text-underline-offset:3px}
.fj-big{font-size:clamp(1.25rem,2.3vw,1.9rem);line-height:2.15;margin:.3em 0}
.fj-big.sol{line-height:2.9}
.fj-big sup,.fj-play sup{font-size:.5em;font-weight:800;margin-left:2px;vertical-align:super}
.fj-heat{background:rgba(255,107,61,var(--h));border-radius:7px;padding:1px 4px}
.fj-sol{position:relative;display:inline-block;background:#1d4d35;border:2px solid var(--ok);border-radius:8px;padding:0 5px;line-height:1.4;margin:0 1px}
.fj-sol .fj-fix{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-2px);background:var(--ok);color:#03200f;font-size:.62em;font-weight:800;padding:1px 6px;border-radius:6px;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.fj-sol .fj-wrongword{text-decoration:line-through;text-decoration-color:#ff8a8a;text-decoration-thickness:2px}
.fj-sol sup.good{color:var(--ok)} .fj-sol sup.badp{color:var(--gold)}
.fj-sol.miss{background:#3a2a10;border:2px dashed var(--gold)}
.fj-sol.miss .fj-fix{background:var(--gold);color:#241a00}
.fj-fp{background:#4a1d26;border-radius:7px;padding:1px 4px;text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.fj-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);margin-top:8px}
.fj-legend span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:transparent}
.fj-legend .fj-sol-l:before{background:var(--ok)} .fj-legend .fj-fp-l:before{background:var(--bad)} .fj-legend .fj-miss-l:before{background:var(--gold)}
.fj-legend span:not([class]):before{display:none}
.fj-stats{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding:12px;border-radius:12px;background:#151937;border:1px solid var(--line)}
.fj-play{font-size:1.18em;line-height:2.25;user-select:none;-webkit-user-select:none}
.fj-play.sol{line-height:2.8;margin-top:10px}
.fj-w{cursor:pointer;padding:2px 3px;border-radius:7px;transition:background .12s;-webkit-tap-highlight-color:transparent}
.fj-w:hover{background:#ffffff14}
.fj-w.on{background:var(--acc);color:#fff;box-shadow:0 0 0 2px #ff6b3d66}
.fj-play.locked .fj-w{cursor:default}
/* ---------- Karten-Battle ---------- */
.km-ed{display:grid;grid-template-columns:1fr 240px;gap:12px;align-items:start}
@media (max-width:760px){.km-ed{grid-template-columns:1fr}}
.km-thumb{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:#0b0f2a}
.km-thumb svg{display:block;width:100%;height:auto;max-height:200px}
.km-thumb-l{position:absolute;right:6px;bottom:6px;background:#000b;font-size:.78em;padding:2px 7px;border-radius:6px;font-weight:700}
.km-thumb:hover{border-color:var(--acc)}
.km-host{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b0f2a}
.km-host svg{display:block;width:100%;height:auto;max-height:66vh}
.km-zoomwrap{position:relative}
.km-zoom{overflow:auto;max-height:62vh;border-radius:12px;border:1px solid var(--line);background:#0b0f2a;-webkit-overflow-scrolling:touch}
.km-inner svg{display:block;width:100%;height:auto;cursor:crosshair}
.km-zbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.km-zbtns button{width:40px;height:40px;padding:0;font-size:1.3em;background:#000c}
.mapsvg .pin circle{fill:var(--blue);stroke:#0b0f2a;stroke-width:2.5}
.mapsvg .pin text{fill:#1b1400;text-anchor:middle;font-weight:900;font-family:system-ui,sans-serif}
.mapsvg .pin.mine circle{fill:var(--acc);stroke:#fff;stroke-width:3}
.mapsvg .pin.top.t1 circle{fill:var(--gold)} .mapsvg .pin.top.t2 circle{fill:#dfe4f5} .mapsvg .pin.top.t3 circle{fill:#e09a5f}
.mapsvg .star{fill:var(--gold);stroke:#241a00;stroke-width:2;filter:drop-shadow(0 0 6px #ffc83d)}
.mapsvg .hitc{fill:rgba(255,200,61,.14);stroke:var(--gold);stroke-width:1.5;stroke-dasharray:5 4}
.mapsvg .gline{stroke:#ffffff55}
.mapsvg .gline.mine{stroke:var(--acc);stroke-dasharray:6 5}
.mapsvg .pname{fill:#fff;text-anchor:middle;font-weight:800;font-family:system-ui,sans-serif;paint-order:stroke;stroke:#0b0f2acc;stroke-width:4px}
.mapsvg .pdrop{animation:pdrop .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pdrop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
.mapsvg.revealed .star{animation:zoom .7s cubic-bezier(.3,1.5,.6,1) both;transform-box:fill-box;transform-origin:center}
.rlist{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.ritem .g{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ritem .p,.ritem .rk{flex-shrink:0}
.fj-w{padding:1px 2px}
</style>
</head>
<body>
<div id="app"></div>

/* ============================================================
   KARTEN-BATTLE – Wo ist das passiert? Tipp auf der Karte.
   MAPS (eingebaute Karten, aus Natural-Earth-Daten) wird beim Bauen
   vor dieses Skript gesetzt: {key:{name,w,h,s,tx,ty,c,svg,gaz}}
   ============================================================ */
const RAD = Math.PI / 180;
const HIT_KM = { sachsen: 5, deutschland: 15, europa: 50, welt: 250 };
const MAP_ORDER = ["sachsen", "deutschland", "europa", "welt"];
// Kartengrafiken einmal ins Dokument legen und überall per <use> wiederverwenden
(function(){
  const holder = document.createElement("div");
  holder.innerHTML = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${MAP_ORDER.map(k => `<g id="km-${k}">${MAPS[k].svg}</g>`).join("")}</defs></svg>`;
  document.body.appendChild(holder.firstChild);
})();
const kmProj = (m, lat, lon) => [m.tx + m.s*lon*RAD*m.c, m.ty - m.s*lat*RAD];
const kmInv = (m, x, y) => [ (m.ty - y) / m.s / RAD, (x - m.tx) / (m.s*m.c) / RAD ];
function haversine(a, b){
  const [la1, lo1] = a.map(v => v*RAD), [la2, lo2] = b.map(v => v*RAD);
  const h = Math.sin((la2-la1)/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2;
  return 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(h)));
}
function mapDims(q){ if(q.map === "custom") return { w: 1000, h: Math.round(1000 * (q.ih || 750) / (q.iw || 1000)) }; const m = MAPS[q.map]; return { w: m.w, h: m.h }; }
function kmDist(q, x, y){ // km (eingebaute Karte) oder % der Kartenbreite (eigenes Bild)
  if(q.map === "custom"){ const d = mapDims(q); return Math.hypot(x - q.x, y - q.y) / d.w * 100; }
  const m = MAPS[q.map]; return haversine(kmInv(m, x, y), kmInv(m, q.x, q.y));
}
const fmtDist = (q, d) => d == null ? "–" : q.map === "custom" ? `${d.toFixed(1)} %` : d < 10 ? `${d.toFixed(1)} km` : `${Math.round(d).toLocaleString("de-DE")} km`;
const hitRadius = q => q.map === "custom" ? 2 : HIT_KM[q.map];
// SVG der Karte; img = Bild-DataURL bei eigener Karte; overlay = zusätzliches SVG
function mapSvg(q, img, overlay="", cls=""){
  const { w, h } = mapDims(q);
  const base = q.map === "custom" ? (img ? `<image href="${img}" width="${w}" height="${h}" preserveAspectRatio="none"/>` : `<rect width="${w}" height="${h}" fill="#151937"/><text x="${w/2}" y="${h/2}" fill="#9aa0c8" font-size="${w/30}" text-anchor="middle">Karte wird geladen …</text>`) : `<use href="#km-${q.map}"/>`;
  return `<svg class="mapsvg ${cls}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${base}${overlay}</svg>`;
}
const U = q => mapDims(q).w / 1000; // Maßstab für Marker
function pin(q, x, y, cls, label, mult=1){
  const u = U(q) * mult;
  return `<g class="pin ${cls}" transform="translate(${x},${y})"><circle r="${9*u}"/>${label != null ? `<text y="${4*u}" font-size="${11*u}">${esc(label)}</text>` : ""}</g>`;
}
function star(q, x, y, mult=1){
  const u = U(q)*1.5*mult, pts = [];
  for(let i = 0; i < 10; i++){ const r = (i % 2 ? 6 : 15) * u, a = Math.PI/5*i - Math.PI/2; pts.push((x + r*Math.cos(a)).toFixed(1) + "," + (y + r*Math.sin(a)).toFixed(1)); }
  return `<polygon class="star" points="${pts.join(" ")}"/>`;
}
function hitCircle(q){
  if(q.map === "custom"){ const d = mapDims(q); return `<circle class="hitc" cx="${q.x}" cy="${q.y}" r="${hitRadius(q)/100*d.w}"/>`; }
  const m = MAPS[q.map]; const [lat] = kmInv(m, q.x, q.y);
  const r = hitRadius(q) / 6371 * m.s; // km → Bogenmaß → Kartenpixel (in y-Richtung)
  return `<ellipse class="hitc" cx="${q.x}" cy="${q.y}" rx="${r*m.c/Math.cos(lat*RAD)}" ry="${r}"/>`;
}
function parseLatLon(s){
  const m = String(s).replace(/°/g, "").match(/(-?\d+(?:[.,]\d+)?)\s*([NS])?\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)\s*([EOW])?/i);
  if(!m) return null;
  let lat = parseFloat(m[1].replace(",", ".")), lon = parseFloat(m[3].replace(",", "."));
  if(/s/i.test(m[2] || "")) lat = -lat; if(/w/i.test(m[4] || "")) lon = -lon;
  if(Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return [lat, lon];
}
function KQ(map, text, lat, lon, place, info){
  const [x, y] = kmProj(MAPS[map], lat, lon);
  return { text, map, img: null, iw: null, ih: null, x: +x.toFixed(1), y: +y.toFixed(1), place, info: info || "" };
}

function svgPoint(ev, q){

  return [x, y];

function resizeImage(file, maxSide=1000){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const make = (max, q) => {
          const sc = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
          const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          return { data: c.toDataURL("image/jpeg", q), w: c.width, h: c.height };
        };
        let d = make(maxSide, .8);
        if(d.data.length > 200000) d = make(Math.round(maxSide*.85), .68);
        if(d.data.length > 200000) d = make(Math.round(maxSide*.7), .6);
        res(d);

      img.src = fr.result;
    };

function rankBy(arr, key){ // Wettkampf-Rangfolge (gleiche Werte = gleicher Platz), arr muss sortiert sein

}

    this.peer.on("disconnected", () => { if(!this.dead) setTimeout(() => { try{ this.peer.reconnect(); }catch(e){} }, 1500); });
    this.peer.on("connection", conn => {
      const id = conn.peer + ":" + conn.connectionId;
      conn.on("open", () => { this.conns.set(id, conn); h.onConn(id); });
      conn.on("data", d => h.onData(id, d));
      conn.on("close", () => { this.conns.delete(id); h.onClose(id); });
      conn.on("error", () => { this.conns.delete(id); h.onClose(id); });
    });
  }
  send(id, msg){ const c = this.conns.get(id); if(c && c.open){ try{ c.send(msg); }catch(e){} } }
  close(id){ const c = this.conns.get(id); if(c){ try{ c.close(); }catch(e){} this.conns.delete(id); } }
  destroy(){ this.dead = true; try{ this.peer && this.peer.destroy(); }catch(e){} }
}
class PeerClient {
  connect(code, h){
    this.h = h; this.done = false;
    if(typeof Peer === "undefined"){ h.onError("nolib"); return; }
    this.peer = new Peer(PEER_OPTS);
    const fail = why => { if(this.done) return; this.done = true; h.onError(why); };
    this.timer = setTimeout(() => fail("timeout"), 15000);
    this.peer.on("open", () => {
      this.conn = this.peer.connect(PREFIX + code, { reliable: true });
      this.conn.on("open", () => { clearTimeout(this.timer); h.onOpen(); });
      this.conn.on("data", d => h.onData(d));
      this.conn.on("close", () => { if(!this.done){ this.done = true; h.onClose(); } });
      this.conn.on("error", () => { if(!this.done){ this.done = true; h.onClose(); } });
    });
    this.peer.on("error", e => fail(e.type === "peer-unavailable" ? "notfound" : (e.type || "error")));
  }
  send(msg){ if(this.conn && this.conn.open){ try{ this.conn.send(msg); }catch(e){} } }
  destroy(){ this.done = true; clearTimeout(this.timer); try{ this.peer && this.peer.destroy(); }catch(e){} }
}
class LocalHost {
  start(code, h){
    this.h = h; this.ch = new BroadcastChannel(PREFIX + code);
    this.ch.onmessage = e => {
      const m = e.data; if(m.to !== "host") return;
      if(m.k === "hello"){ h.onConn(m.from); this.ch.postMessage({to: m.from, k: "welcome"}); }
      else if(m.k === "msg") h.onData(m.from, m.d);
      else if(m.k === "bye") h.onClose(m.from);
    };
    setTimeout(() => h.onOpen(), 50);
  }
  send(id, d){ this.ch.postMessage({to: id, k: "msg", d}); }
  close(id){ this.ch.postMessage({to: id, k: "close"}); }
  destroy(){ try{ this.ch.close(); }catch(e){} }
}
class LocalClient {
  connect(code, h){
    this.h = h; this.id = rid(); this.ch = new BroadcastChannel(PREFIX + code); this.done = false;
    this.ch.onmessage = e => {
      const m = e.data; if(m.to !== this.id) return;
      if(m.k === "welcome"){ clearTimeout(this.t); h.onOpen(); }
      else if(m.k === "msg") h.onData(m.d);
      else if(m.k === "close"){ this.done = true; h.onClose(); }
    };
    this.t = setTimeout(() => { if(!this.done){ this.done = true; h.onError("notfound"); } }, 2500);
    this.ch.postMessage({to: "host", from: this.id, k: "hello"});
  }
  send(d){ try{ this.ch.postMessage({to: "host", from: this.id, k: "msg", d}); }catch(e){} }
  destroy(){ this.done = true; clearTimeout(this.t); try{ this.ch.postMessage({to:"host",from:this.id,k:"bye"}); this.ch.close(); }catch(e){} }
}
const makeHost = () => LOCAL_TEST ? new LocalHost() : new PeerHost();
const makeClient = () => LOCAL_TEST ? new LocalClient() : new PeerClient();

/* ---------- Raum ---------- */
function openRoom(){
  const qs = validQuestions();
  if(!qs.length){ toast(`Bitte mindestens ${GAME.itemLabelAcc || "einen Eintrag"} vollständig anlegen.`); return; }
  const order = qs.map((_,i) => i);
  if(G.settings.shuffle) for(let i = order.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [order[i],order[j]] = [order[j],order[i]]; }
  G = {
    code: newCode(), created: Date.now(), settings: G.settings,
    setName: editorSet.name, questions: order.map(i => clone(qs[i])),
    qi: -1, phase: "lobby", locked: false, revealStep: 0, deadline: null,
    players: {}, kicked: [], answers: {}, results: {}
  };
  startHost();
}
function saveGame(){
  if(!G || !G.code) return;
  if(!store.set(K("game"), G)){
    const lite = Object.assign({}, G, { questions: G.questions.map(q => Object.assign({}, q, { img: null })) });
    store.set(K("game"), lite);
  }
}
function startHost(resume){
  connToPid = new Map(); lastSeen = new Map();
  Object.values(G.players).forEach(p => { p.connected = false; p.connId = null; });
  $app.innerHTML = `<div class="wrap center" style="margin-top:20vh"><div class="spinner"></div><h2>${resume ? "Raum wird wiederhergestellt …" : "Raum wird geöffnet …"}</h2><p class="mut">Das kann ein paar Sekunden dauern.</p></div>`;
  let tries = 0;
  const attempt = () => {
    host && host.destroy();
    host = makeHost();
    host.start(G.code, {
      onOpen: () => { saveGame(); renderHost(); },
      onConn: id => { lastSeen.set(id, Date.now()); },
      onData: (id, m) => { lastSeen.set(id, Date.now()); hostHandle(id, m); },
      onClose: id => hostDrop(id),
      onError: why => {
        if(why === "taken"){
          if(resume && tries++ < 12){ setTimeout(attempt, 2500); return; }
          if(!resume){ G.code = newCode(); setTimeout(attempt, 200); return; }
        }
        if(why === "network" && tries++ < 5){ setTimeout(attempt, 2500); return; }
        renderHostError(why);
      }
    });
  };
  attempt();
  clearInterval(hostTick);
  hostTick = setInterval(hostHeartbeat, 1000);
}
function renderHostError(why){
  const msg = {
    nolib: "Die Verbindungs-Bibliothek konnte nicht geladen werden.",
    network: "Keine Verbindung zum Vermittlungsserver. Ist das Gerät online? Manche Schulnetze blockieren solche Verbindungen.",
    browser: "Dieser Browser unterstützt keine Direktverbindungen (WebRTC). Bitte Chrome, Edge, Firefox oder Safari in aktueller Version nutzen.",
    taken: "Der Raum-Code ist gerade belegt."
  }[why] || "Unbekannter Fehler beim Öffnen des Raums.";
  $app.innerHTML = `<div class="wrap" style="max-width:640px;margin-top:14vh"><div class="card col"><h2>Raum konnte nicht geöffnet werden</h2><p>${esc(msg)}</p><div class="row"><button class="btn-main" id="retry">Nochmal versuchen</button><button id="back">Zurück zum Editor</button></div></div></div>`;
  document.getElementById("retry").onclick = () => startHost(true);
  document.getElementById("back").onclick = () => endGame(true);
}
function hostHeartbeat(){
  if(!host || !G) return;
  const now = Date.now();
  connToPid.forEach((pid, id) => { if(now - (lastSeen.get(id) || 0) > 16000){ host.close(id); hostDrop(id); } });
  if(G.phase === "question" && !G.locked && G.deadline){
    const left = Math.max(0, Math.ceil((G.deadline - now) / 1000));
    const el = document.getElementById("timer");
    if(el){ el.textContent = left; el.classList.toggle("low", left <= 5); }
    if(now >= G.deadline){ G.locked = true; saveGame(); broadcast(); renderHost(); }
  }
}
function hostDrop(id){
  const pid = connToPid.get(id);
  connToPid.delete(id); lastSeen.delete(id);
  if(pid && G.players[pid] && G.players[pid].connId === id){ G.players[pid].connected = false; G.players[pid].connId = null; scheduleHostRender(); }
}
function cleanName(n){ return String(n || "").replace(/[\u0000-\u001f<>]/g, "").replace(/\s+/g, " ").trim().slice(0, 20); }
function hostHandle(id, m){
  if(!m || typeof m !== "object") return;
  if(m.t === "alive"){ host.send(id, { t: "ack" }); return; }
  if(m.t === "join"){
    const pid = String(m.pid || "").slice(0, 40);
    if(!pid) return;
    if(G.kicked.includes(pid)){ host.send(id, { t: "reject", reason: "Du wurdest von der Spielleitung aus dem Raum entfernt." }); return; }
    let p = G.players[pid];
    if(!p){
      if(Object.keys(G.players).length >= MAX_PLAYERS){ host.send(id, { t: "reject", reason: `Der Raum ist voll (höchstens ${MAX_PLAYERS} Spieler:innen).` }); return; }
      let name = cleanName(m.name);
      if(!name){ host.send(id, { t: "reject", reason: "Bitte gib einen Namen ein." }); return; }
      const taken = new Set(Object.values(G.players).map(x => x.name.toLowerCase()));
      if(taken.has(name.toLowerCase())){ let k = 2; while(taken.has(`${name} ${k}`.toLowerCase())) k++; name = `${name} ${k}`; }
      p = G.players[pid] = { name, score: 0, hits: 0, last: null, joined: Date.now() };
    }
    if(p.connId && p.connId !== id){ connToPid.delete(p.connId); host.close(p.connId); }
    p.connId = id; p.connected = true; connToPid.set(id, pid);
    saveGame();
    sendImageTo(id);
    host.send(id, studentState(pid));
    scheduleHostRender();
    return;
  }
  const pid = connToPid.get(id);
  if(!pid || !G.players[pid]) return;
  if(m.t === "answer"){
    if(G.phase !== "question" || G.locked){ host.send(id, studentState(pid)); return; }
    const a = GAME.validateAnswer(G.questions[G.qi], m.a);
    if(a == null) return;
    (G.answers[G.qi] = G.answers[G.qi] || {})[pid] = a;
    saveGame();
    host.send(id, studentState(pid));
    scheduleHostRender();
  }
}
function scheduleHostRender(){
  if(renderPending) return;
  renderPending = true;
  setTimeout(() => { renderPending = false; if(G && G.code && (G.phase === "lobby" || G.phase === "question") && !document.querySelector(".modal-bg")) renderHost(); else if(G && G.code) updateTopbarCounts(); }, 250);
}
function imgKeyOf(qi){ return G.code + ":" + qi; }
function sendImageTo(id){
  const q = G.questions[G.qi];
  const img = q && GAME.qImage ? GAME.qImage(q) : null;
  if(img && (G.phase === "question" || G.phase === "reveal")) host.send(id, { t: "img", key: imgKeyOf(G.qi), data: img });
}
function broadcast(withImage){
  connToPid.forEach((pid, id) => { if(withImage) sendImageTo(id); host.send(id, studentState(pid)); });
}
function standings(){
  const arr = Object.entries(G.players).map(([pid, p]) => ({ pid, ...p }));
  arr.sort((a,b) => (b.score - a.score) || (b.hits - a.hits));
  return rankBy(arr, x => x.score + "|" + x.hits);
}
function studentState(pid){
  const p = G.players[pid];
  const st = standings();
  const me = st.find(x => x.pid === pid);
  const q = G.questions[G.qi];
  const s = {
    t: "state", phase: G.phase, setName: G.setName,
    me: { name: p.name, score: p.score, hits: p.hits, rank: me ? me.rank : null, of: st.length },
    total: G.questions.length, n: G.qi + 1
  };
  if(G.phase === "question" || G.phase === "reveal"){
    s.q = GAME.publicQ(q, G.settings);
    if(GAME.qImage && GAME.qImage(q)) s.q.imgKey = imgKeyOf(G.qi);
    s.myAnswer = (G.answers[G.qi] || {})[pid] ?? null;
  }
  if(G.phase === "question"){
    s.locked = G.locked;
    s.remaining = G.deadline && !G.locked ? Math.max(0, G.deadline - Date.now()) : null;
  }
  if(G.phase === "reveal"){
    s.revealStep = G.revealStep;
    if(G.revealStep >= 1){
      const r = (G.results[G.qi] || {})[pid] || { pts: 0 };
      s.result = Object.assign({}, r, GAME.playerSolution(q, r, s.myAnswer, G.settings));
    }
  }
  if(G.phase === "final") s.podium = st.filter(x => x.rank <= 3).map(x => ({ name: x.name, val: x.score, rank: x.rank }));
  return s;
}

/* ---------- Spielablauf ---------- */
function nextQuestion(){
  if(G.qi + 1 >= G.questions.length){ G.phase = "final"; saveGame(); broadcast(); renderHost(); confetti(); return; }
  G.qi++; G.phase = "question"; G.locked = false; G.revealStep = 0;
  G.deadline = G.settings.timer ? Date.now() + G.settings.timer * 1000 : null;
  G.answers[G.qi] = {};
  saveGame(); broadcast(true); renderHost();
}
function revealStep0(){ G.locked = true; G.phase = "reveal"; G.revealStep = 0; saveGame(); broadcast(); renderHost(); }
function revealAnswer(){
  if(!G.results[G.qi]){
    const q = G.questions[G.qi], ans = G.answers[G.qi] || {};
    const pids = Object.keys(G.players);
    const res = GAME.computeRound(q, ans, pids, G.settings);
    // Rundenplatz nach Punkten
    const arr = pids.map(pid => ({ pid, pts: res[pid] ? res[pid].pts : 0, answered: ans[pid] != null })).sort((a,b) => b.pts - a.pts);
    rankBy(arr, x => x.pts).forEach(x => { res[x.pid] = Object.assign({ pts: 0 }, res[x.pid] || {}, { rrank: x.rank, of: arr.length }); });
    G.results[G.qi] = res;
    Object.entries(res).forEach(([pid, r]) => { const p = G.players[pid]; if(!p) return; p.score += r.pts; if(r.hit) p.hits++; p.last = r.pts; });
  }
  G.revealStep = 1; saveGame(); broadcast(); renderHost();
  if(Object.values(G.results[G.qi]).some(r => r.hit)) confetti(1200);
}
function showBoard(){ G.phase = "board"; saveGame(); broadcast(); renderHost(); }
function kick(pid){
  const p = G.players[pid]; if(!p) return;
  confirmBox(`${p.name} aus dem Raum entfernen?`, "Entfernen", () => {
    if(p.connId){ host.send(p.connId, { t: "reject", reason: "Du wurdest von der Spielleitung aus dem Raum entfernt." }); const cid = p.connId; connToPid.delete(cid); setTimeout(() => host && host.close(cid), 300); }
    G.kicked.push(pid); delete G.players[pid]; saveGame(); renderHost();
  });
}
function endGame(silent){
  const go = () => {
    if(host) connToPid.forEach((pid, id) => host.send(id, { t: "ended" }));
    setTimeout(() => { host && host.destroy(); host = null; }, 400);
    clearInterval(hostTick);
    store.del(K("game"));
    const settings = G.settings; G = { settings };
    if(!editorSet) editorSet = store.get(K("editor")) || sampleSet(0);
    renderEditor();
  };
  if(silent) go(); else confirmBox("Spiel beenden? Alle Schüler:innen werden getrennt.", "Beenden", go);
}

let P = { code: null, pid: null, name: "", client: null, state: null, imgs: {}, everConnected: false, retry: null, lastMsg: 0, local: {}, deadlineLocal: null, viewKey: "" };

function renderJoin(prefill, err){
  stopClient();
  const code = (prefill || "").toUpperCase();
  const savedName = sstore.get("kb-name") || "";
  $app.innerHTML = `
  <div class="pwrap">
    <div class="logo" style="justify-content:center;margin:20px 0 10px"><span class="dot"></span><b>${esc(GAME.title)}</b></div>
    <div class="card col">
      <h2 style="margin:0">Mitspielen</h2>
      ${err ? `<div class="status err">${esc(err)}</div>` : ""}
      <label class="col" style="gap:6px">Raum-Code<input id="code" value="${esc(code)}" maxlength="5" autocomplete="off" autocapitalize="characters" style="font-size:1.8em;letter-spacing:.25em;text-align:center;font-weight:900;font-family:ui-monospace,Menlo,Consolas,monospace" placeholder="ABCDE"></label>
      <label class="col" style="gap:6px">Dein Name<input id="name" value="${esc(savedName)}" maxlength="20" autocomplete="off" placeholder="Vorname oder Spitzname" style="font-size:1.2em"></label>
      <button class="btn-main btn-xl" id="join">Beitreten</button>
      <p class="mut small" style="margin:0">Tipp: Nimm deinen Vornamen oder einen Spitznamen, an dem deine Lehrkraft dich erkennt.</p>
    </div>
  </div>`;
  const ci = document.getElementById("code"), ni = document.getElementById("name");
  ci.oninput = () => { ci.value = ci.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); };
  (code.length === 5 ? ni : ci).focus();
  const go = () => {
    const c = ci.value.trim().toUpperCase(), n = cleanName(ni.value);
    if(c.length !== 5){ toast("Der Code hat 5 Zeichen."); ci.focus(); return; }
    if(!n){ toast("Bitte gib deinen Namen ein."); ni.focus(); return; }
    sstore.set("kb-name", n);
    P.code = c; P.name = n;
    P.pid = sstore.get(K("pid-") + c) || rid(14); sstore.set(K("pid-") + c, P.pid);
    P.everConnected = false; P.state = null;
    try{ history.replaceState(null, "", location.pathname + location.search + "#" + c); }catch(e){}
    connectClient();
  };
  document.getElementById("join").onclick = go;
  ni.onkeydown = ci.onkeydown = e => { if(e.key === "Enter") go(); };
}
function stopClient(){ clearTimeout(P.retry); clearInterval(P.watch); if(P.client){ P.client.destroy(); P.client = null; } }
function connectClient(){
  stopClient();
  if(!P.state) renderPlayerMsg(`<div class="spinner"></div><h2>Verbinde mit Raum ${esc(P.code)} …</h2>`);
  else setConnBanner("Verbindung wird wiederhergestellt …");
  const c = P.client = makeClient();
  c.connect(P.code, {
    onOpen: () => { P.lastMsg = Date.now(); c.send({ t: "join", pid: P.pid, name: P.name }); },
    onData: m => { P.lastMsg = Date.now(); playerHandle(m); },
    onClose: () => scheduleReconnect(),
    onError: why => {
      if(!P.everConnected){
        const msg = { notfound: "Kein Raum mit diesem Code gefunden. Stimmt der Code? Ist der Raum der Lehrkraft geöffnet?",
          timeout: "Die Verbindung hat zu lange gedauert. Bitte nochmal versuchen.",
          nolib: "Die Seite konnte nicht vollständig geladen werden.",
          "browser-incompatible": "Dieser Browser kann leider nicht mitspielen. Bitte einen aktuellen Browser nutzen." }[why] || "Verbindung fehlgeschlagen. Bitte nochmal versuchen.";
        stopClient(); renderJoin(P.code, msg);
      } else scheduleReconnect();
    }
  });
  P.watch = setInterval(() => {
    if(P.client && P.everConnected) P.client.send({ t: "alive" });
    if(P.everConnected && Date.now() - P.lastMsg > 16000) scheduleReconnect();
  }, 4000);
}
function scheduleReconnect(){
  if(P.ended) return;
  stopClient();
  setConnBanner("Verbindung unterbrochen – versuche es erneut …");
  P.retry = setTimeout(connectClient, 2500);
}
function setConnBanner(text){
  let b = document.getElementById("connbanner");
  if(!b){ b = document.createElement("div"); b.id = "connbanner"; b.className = "status warn"; b.style.cssText = "position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:20;max-width:92vw"; document.body.appendChild(b); }
  b.textContent = text;
}
function clearConnBanner(){ const b = document.getElementById("connbanner"); if(b) b.remove(); }
function sendAnswer(a){ P.client && P.client.send({ t: "answer", a }); }
function playerHandle(m){
  if(!m || typeof m !== "object") return;
  if(m.t === "ack") return;
  if(m.t === "img"){ if(typeof m.data === "string" && m.data.startsWith("data:image/")){ P.imgs[m.key] = m.data; if(P.state) renderPlayer(null, true); } return; }
  if(m.t === "reject"){ P.ended = true; stopClient(); clearConnBanner(); renderJoin(P.code, m.reason); P.ended = false; return; }
  if(m.t === "ended"){ P.ended = true; stopClient(); clearConnBanner(); renderPlayerMsg(`<h2>Das Spiel wurde beendet.</h2><p class="mut">Danke fürs Mitspielen!</p><button class="btn-main" onclick="location.hash='';location.reload()">Neu beitreten</button>`); return; }
  if(m.t === "state"){
    P.everConnected = true; clearConnBanner();
    const prev = P.state;
    if(!prev || prev.n !== m.n || prev.phase !== m.phase) P.local = {};
    P.state = m;
    if(m.phase === "question" && m.remaining != null) P.deadlineLocal = Date.now() + m.remaining; else if(m.phase !== "question" || m.locked) P.deadlineLocal = null;
    const key = [m.phase, m.n, m.locked, m.revealStep].join("|");
    if(key === P.viewKey && GAME.playerUpdate && m.phase === "question"){ GAME.playerUpdate(playerCtx()); updatePlayerHeader(); return; }
    P.viewKey = key;
    renderPlayer(prev);
  }
}
function renderPlayerMsg(inner){
  $app.innerHTML = `<div class="pwrap"><div class="logo" style="justify-content:center;margin:20px 0 10px"><span class="dot"></span><b>${esc(GAME.title)}</b></div><div class="card center col">${inner}</div></div>`;
}
function playerHeaderHtml(s){
  return `<div class="row" id="phead" style="justify-content:space-between;margin-bottom:10px">
    <span class="pill">👤 ${esc(s.me.name)}</span>
    <span class="pill">${s.me.score} Pkt${s.me.rank ? ` · Platz ${s.me.rank}/${s.me.of}` : ""}</span>
  </div>`;
}
function updatePlayerHeader(){ const h = document.getElementById("phead"); if(h && P.state) h.outerHTML = playerHeaderHtml(P.state); }
function playerCtx(){
  const s = P.state;
  return {
    q: s.q, n: s.n, total: s.total, settings: null,
    img: s.q && s.q.imgKey ? P.imgs[s.q.imgKey] || null : null,
    myAnswer: s.myAnswer, locked: !!(s.locked || (P.deadlineLocal && Date.now() >= P.deadlineLocal)),
    local: P.local, send: sendAnswer, result: s.result
  };
}
function renderPlayer(prev, imageOnly){
  const s = P.state; if(!s) return;
  clearInterval(P.localTimer);
  const head = `<div class="pwrap ${GAME.wide ? "wide" : ""}"><div class="logo" style="justify-content:center;margin:6px 0 12px;font-size:1em"><span class="dot"></span><b>${esc(GAME.title)}</b></div>${playerHeaderHtml(s)}`;
  if(s.phase === "lobby"){
    $app.innerHTML = head + `<div class="card center col"><h2>Du bist drin! 🎉</h2><p class="mut">Warte, bis die Lehrkraft das Spiel startet.</p><div class="spinner"></div><p class="small mut">${GAME.howTo}</p></div></div>`;
    return;
  }
  if(s.phase === "question"){
    const ctx = playerCtx();
    $app.innerHTML = head + `<div class="card col"><div class="row"><div class="qnum grow">${esc(GAME.roundWord)} ${s.n} von ${s.total}</div>${P.deadlineLocal && !ctx.locked ? `<div class="timer" id="ptimer" style="font-size:1.6em"></div>` : ""}</div><div id="gq"></div></div></div>`;
    GAME.playerQuestion(document.getElementById("gq"), ctx, prev);
    if(P.deadlineLocal && !ctx.locked){
      const tick = () => {
        const el = document.getElementById("ptimer"); if(!el) return;
        const left = Math.max(0, Math.ceil((P.deadlineLocal - Date.now())/1000));
        el.textContent = left; el.classList.toggle("low", left <= 5);
        if(left <= 0){ clearInterval(P.localTimer); P.viewKey = ""; renderPlayer(); }
      };
      tick(); P.localTimer = setInterval(tick, 250);
    }
    return;
  }
  if(s.phase === "reveal"){
    if(!s.revealStep){
      $app.innerHTML = head + `<div class="card center col"><div class="qnum">${esc(GAME.roundWord)} ${s.n} von ${s.total}</div><h2>Schau nach vorn! 👀</h2><p class="mut">${esc(GAME.waitReveal || "Gleich kommt die Lösung …")}</p><div class="spinner"></div></div></div>`;
      return;
    }
    const r = s.result || {};
    const verdict = r.hit ? "🎯 VOLLTREFFER!" : r.rrank === 1 ? "🥇 Bestes Ergebnis dieser Runde!" : r.rrank <= 3 ? `Stark – Platz ${r.rrank} in dieser Runde!` : `Platz ${r.rrank} von ${r.of} in dieser Runde`;
    $app.innerHTML = head + `<div class="card col"><div class="qnum center">${esc(GAME.roundWord)} ${s.n} von ${s.total}</div>
      <h2 class="center" style="margin:.1em 0">${verdict}</h2>
      <div class="stat"><span class="mut small">Punkte diese Runde</span><b style="color:var(--ok)">+${r.pts ?? 0}</b></div>
      <div id="gres"></div></div></div>`;
    GAME.playerReveal(document.getElementById("gres"), playerCtx());
    if(r.hit && !imageOnly) confetti(1500);
    return;
  }
  if(s.phase === "board"){
    $app.innerHTML = head + `<div class="card center col"><h2>Zwischenstand</h2><div class="mut">nach ${s.n} von ${s.total} ${esc(GAME.roundWordPl)}</div><div class="bigrank">${s.me.rank}.</div><div class="mut">von ${s.me.of}</div><p>${s.me.score} Punkte${s.me.hits ? ` · 🎯 ${s.me.hits}` : ""}</p></div></div>`;
    return;
  }
  if(s.phase === "final"){
    const top = s.me.rank && s.me.rank <= 3;
    $app.innerHTML = head + `<div class="card center col"><h2>${top ? "🏆 Du stehst auf dem Treppchen!" : "Geschafft!"}</h2><div class="bigrank">${s.me.rank}.</div><div class="mut">von ${s.me.of}</div>
      <p>${s.me.score} Punkte${s.me.hits ? ` · 🎯 ${s.me.hits}` : ""}</p>
      <div class="col" style="gap:6px;text-align:left">${(s.podium||[]).map(x => `<div class="ritem ${x.rank===1?"top1":x.rank===2?"top2":"top3"}"><span class="rk">${x.rank}.</span><span class="nm">${esc(x.name)}</span><span class="p">${x.val}</span></div>`).join("")}</div></div></div>`;
    if(top && (!prev || prev.phase !== "final")) confetti(2500);
  }
}

/* ---------- Konfetti ---------- */
function confetti(ms=2500){
  const cv = document.getElementById("confetti"); cv.classList.remove("hidden");
  const ctx = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#ff6b3d","#ff3d7f","#ffc83d","#33d17a","#5aa9ff","#ffffff"];
  const ps = Array.from({length: 160}, () => ({ x: Math.random()*cv.width, y: -20 - Math.random()*cv.height*.5, vx: (Math.random()-.5)*4, vy: 2 + Math.random()*4, s: 5 + Math.random()*6, r: Math.random()*6, vr: (Math.random()-.5)*.3, c: cols[Math.floor(Math.random()*cols.length)] }));
  const end = Date.now() + ms;
  (function f(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .05; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(Date.now() < end + 2500 && (Date.now() < end || ps.some(p => p.y < cv.height))) return requestAnimationFrame(f);
    ctx.clearRect(0,0,cv.width,cv.height); cv.classList.add("hidden");
  })();
}

/* ============================================================
   Start
   ============================================================ */
function renderStart(){
  const saved = store.get(K("game"));
  const resumable = saved && saved.code && saved.phase && Date.now() - (saved.created || 0) < 8*3600*1000;
  $app.innerHTML = `
  <div class="wrap">
    <div class="center"><div class="title-xl"><span>${esc(GAME.title)}</span></div>
    <p class="mut" style="font-size:1.15em;max-width:680px;margin:0 auto">${GAME.tagline} Für die ganze Klasse, mit bis zu ${MAX_PLAYERS} Geräten.</p></div>
    ${resumable ? `<div class="card row" style="margin-top:24px;border-color:var(--gold)"><div class="grow"><b>Laufendes Spiel gefunden</b> – Code <span class="codebadge">${esc(saved.code)}</span>, ${Object.keys(saved.players||{}).length} Spieler:innen, ${saved.phase === "lobby" ? "noch in der Lobby" : `${esc(GAME.roundWord)} ${saved.qi+1} von ${saved.questions.length}`}.</div><button class="btn-gold" id="resume">Fortsetzen</button><button class="btn-sm btn-ghost" id="discard">Verwerfen</button></div>` : ""}
    <div class="hero">
      <div class="card col">
        <div style="font-size:2.4em">🎓</div>
        <h2>Ich leite das Spiel</h2>
        <p class="mut">${esc(GAME.itemsLabel)} vorbereiten, Raum öffnen und am Beamer zeigen. Die Klasse tritt per QR-Code oder Raum-Code bei.</p>
        <div class="grow"></div>
        <button class="btn-main btn-xl" id="teach">Spiel vorbereiten</button>
      </div>
      <div class="card col">
        <div style="font-size:2.4em">✋</div>
        <h2>Ich spiele mit</h2>
        <p class="mut">Du hast einen Code von deiner Lehrkraft bekommen? Dann hier entlang.</p>
        <div class="grow"></div>
        <button class="btn-xl" id="play">Code eingeben</button>
      </div>
    </div>
    <div class="foot">Läuft direkt im Browser · keine Anmeldung · Geräte verbinden sich direkt miteinander${GAME.credits ? " · " + GAME.credits : ""}</div>
  </div>`;
  document.getElementById("teach").onclick = startTeacher;
  document.getElementById("play").onclick = () => renderJoin("");
  if(resumable){
    document.getElementById("resume").onclick = () => { G = saved; G.settings = Object.assign(defaultSettings(), G.settings); startHost(true); };
    document.getElementById("discard").onclick = () => { store.del(K("game")); renderStart(); };
  }
}
window.addEventListener("beforeunload", e => { if(G && G.code && host && G.phase !== "final"){ e.preventDefault(); e.returnValue = ""; } });
(function init(){
  const h = location.hash.replace("#", "").trim().toUpperCase();
  if(/^[A-Z0-9]{5}$/.test(h)){
    const pid = sstore.get(K("pid-") + h), name = sstore.get("kb-name");
    if(pid && name){ P.code = h; P.pid = pid; P.name = name; connectClient(); }
    else renderJoin(h);
  } else renderStart();
})();
</script>
