<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verriegelt! 1914–1918 – Escape-Room Erster Weltkrieg</title>
<style>
:root{
  --bg:#141612; --card:#22251d; --card2:#1a1c16; --line:#3d4230; --rust:#b5543a; --rust2:#d9734f;
  --brass:#c9a45c; --brass2:#e6cd8e; --paper:#ece2c8; --paper2:#ddd0ae; --ink:#2b2418;
  --txt:#ece9df; --mut:#a9a796; --ok:#7fbf6a; --bad:#e2665a; --r:12px;
  --serif: Georgia, "Times New Roman", serif;
  --type: "Courier New", Courier, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,#2c2f22 0%,transparent 65%),
  repeating-linear-gradient(0deg,#ffffff03 0 2px,transparent 2px 4px),var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border-radius:8px;padding:.65em 1.15em;background:#2c3024;border:1px solid #4b5139;font-weight:650;transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.15)}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default;filter:none;transform:none}
.btn-main{background:linear-gradient(180deg,var(--rust2),var(--rust));border:1px solid #e89a7d;color:#fff;box-shadow:0 4px 16px #b5543a44}
.btn-ghost{background:transparent}
.btn-sm{padding:.4em .8em;font-size:.88em;border-radius:7px}
.btn-xl{font-size:1.15em;padding:.75em 1.5em}
input,select{background:#0f100c;border:1px solid #4b5139;border-radius:8px;padding:.6em .8em;outline:none}
input:focus,select:focus{border-color:var(--brass)}
h1,h2,h3{font-family:var(--serif);margin:.2em 0 .4em;line-height:1.15}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1}
.mut{color:var(--mut)}
.small{font-size:.88em}
.center{text-align:center}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 10px 40px #0007}
.top{position:sticky;top:0;z-index:5;background:#141612ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:800;color:var(--brass2);display:flex;align-items:center;gap:.4em}
.pill{display:inline-flex;align-items:center;gap:.35em;padding:.28em .75em;border-radius:999px;background:#23261d;border:1px solid var(--line);font-weight:650;font-size:.9em}
.pill.warn{border-color:var(--bad);color:#ffb3ab}
.timer{font-variant-numeric:tabular-nums}
.letters{display:flex;gap:4px}
.slot{width:26px;height:30px;border-radius:5px;border:1px dashed #5d6247;display:flex;align-items:center;justify-content:center;font-family:var(--type);font-weight:900;color:var(--brass2)}
.slot.full{border:1px solid var(--brass);background:#2e2a1a;animation:pop .4s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.path{display:flex;align-items:center;justify-content:center;margin:8px 0 2px}
.path .st{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1c1f17;border:2px solid #4b5139;font-size:.9em}
.path .st.done{border-color:var(--brass);background:#2e2a1a}
.path .st.cur{border-color:var(--rust2);box-shadow:0 0 0 4px #b5543a33;background:#3a2219}
.path .ln{width:18px;height:2px;background:#4b5139}
.path .ln.done{background:var(--brass)}
@media (max-width:480px){.path .st{width:26px;height:26px;font-size:.78em}.path .ln{width:8px}}
.roomhead{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center}
@media (max-width:560px){.roomhead{grid-template-columns:66px 1fr}}
.roomhead svg{width:100%;height:auto;display:block}
.roomhead h1{font-size:clamp(1.35rem,5.5vw,2.05rem);overflow-wrap:anywhere;hyphens:auto}
.place{font-size:.78em;letter-spacing:.14em;text-transform:uppercase;color:var(--rust2);font-weight:700}
.story{font-size:1.06em;line-height:1.6}
.doc{background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);border-radius:4px;padding:18px 20px;font-size:1.02em;line-height:1.6;box-shadow:inset 0 0 50px #a89062aa,0 6px 20px #0006;position:relative}
.doc.letter h3{padding-right:96px}
.doc h3{margin-top:0;color:#5a3b1c;font-size:.95em;letter-spacing:.08em;text-transform:uppercase;font-family:var(--type)}
.doc p{margin:.45em 0}
.doc.letter{font-family:var(--serif);font-style:italic;font-size:1.08em}
.doc.letter .date{font-style:normal;font-family:var(--type);font-size:.85em;color:#6b4a22}
.doc .sig{text-align:right;margin-top:.5em}
.doc .stamp{position:absolute;right:14px;top:12px;border:2px solid #8b2d22;color:#8b2d22;font-family:var(--type);font-size:.7em;padding:2px 6px;transform:rotate(8deg);opacity:.75;font-style:normal;font-weight:700}
.facts{background:#1a1c16;border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:12px 16px;line-height:1.55}
.facts p{margin:.35em 0}
.facts b{color:var(--brass2)}
.puzzle{border-top:1px solid var(--line);padding-top:14px}
.q{font-weight:700;font-size:1.06em;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.opt{text-align:left;padding:.75em .9em;border-radius:9px;background:#1c1f17;border:1px solid var(--line);font-weight:550;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.opt .box{flex:0 0 22px;height:22px;border-radius:5px;border:2px solid #727a58;display:flex;align-items:center;justify-content:center;font-size:.85em;margin-top:1px}
.opt.on{border-color:var(--brass);background:#2a2a1e}
.opt.on .box{background:var(--brass);border-color:var(--brass);color:#2b2418}
.opt.radio .box{border-radius:50%}
.feedback{min-height:1.4em;margin-top:8px;font-weight:650}
.feedback.bad{color:#ff9d93}
.feedback.good{color:var(--ok)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.lock{display:flex;gap:8px;justify-content:center;margin:8px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel button{width:50px;padding:.25em;font-size:1.05em}
.wheel .d{width:50px;height:62px;border-radius:8px;background:linear-gradient(180deg,#1a1c16,#3a3d2c 50%,#1a1c16);border:2px solid var(--brass);display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:900;font-family:var(--type);color:var(--brass2)}
.textans{display:flex;gap:10px}
.textans input{flex:1;min-width:0;font-size:1.3em;font-family:var(--type);letter-spacing:.15em;text-transform:uppercase;text-align:center;font-weight:800}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:10px;border-radius:10px;border:1px dashed #5d6247;background:#121410}
.chipx{padding:.45em .8em;border-radius:8px;background:var(--paper);color:var(--ink);font-weight:700;border:2px solid transparent;text-align:left;line-height:1.3;max-width:100%}
.chipx.sel{border-color:var(--rust2);box-shadow:0 0 0 3px #d9734f66;transform:translateY(-2px)}
.cats{display:grid;gap:8px;margin-top:10px}
.cat{border-radius:10px;border:2px solid var(--line);background:#1c1f17;padding:10px;min-height:100px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.cat.target{border-color:var(--brass);background:#26281e}
.cat h4{margin:0;font-family:var(--serif);color:var(--brass2)}
.cat .sub{font-size:.8em;color:var(--mut)}
.cat .in{display:flex;flex-wrap:wrap;gap:6px}
.seq{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.seqitem{display:flex;gap:10px;align-items:center;text-align:left;padding:.6em .8em;border-radius:9px;background:#1c1f17;border:1px solid var(--line);font-weight:600;width:100%}
.seqitem .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--brass);color:#2b2418;display:flex;align-items:center;justify-content:center;font-weight:900}
.seqitem.picked{opacity:.4}
.slotline{display:flex;gap:10px;align-items:center;padding:.55em .8em;border-radius:9px;border:1px dashed #5d6247;min-height:44px}
.slotline .n{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--brass);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--brass2)}
.slotline.filled{border-style:solid;background:#2a2a1e;cursor:pointer}
.cloze{font-size:1.08em;line-height:2.3}
.cloze select{padding:.25em .4em;font-size:.95em;border-color:var(--brass);background:#121410;color:var(--txt);font-weight:700;max-width:100%}
.cloze select.wrong{border-color:var(--bad);background:#3a1a16}
.cloze select.right{border-color:var(--ok)}
.hintbox{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.hint{background:#1c1f17;border-left:4px solid var(--brass);padding:8px 12px;border-radius:6px}
.overlay{position:fixed;inset:0;background:#070806dd;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.overlay .card{max-width:620px;width:100%;max-height:94vh;overflow:auto;animation:rise .45s cubic-bezier(.3,1.4,.6,1)}
@keyframes rise{from{transform:translateY(30px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.door{width:110px;margin:0 auto 6px;display:block}
.bigletter{font-family:var(--type);font-size:3.6em;font-weight:900;color:var(--brass2);text-shadow:0 0 24px #c9a45c88;line-height:1;margin:6px 0;animation:pop .6s}
.merk{background:#1c1f17;border:1px solid #5d6247;border-radius:9px;padding:10px 14px;line-height:1.5}
.merk b{color:var(--brass2)}
.title-xl{font-family:var(--serif);font-size:clamp(2rem,6.5vw,3.4rem);font-weight:800;color:var(--paper);margin:2vh 0 .2em;line-height:1.05;letter-spacing:.01em}
.title-xl span{color:var(--rust2)}
.hero{width:min(92vw,560px);margin:3vh auto 0;display:block}
.cert{background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);border-radius:6px;padding:22px;text-align:center;font-family:var(--serif);border:6px double #6b4a22}
.cert h2{color:#5a3b1c;margin:.1em 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stats div{background:#ffffff66;border-radius:6px;padding:8px}
.stats b{display:block;font-size:1.4em}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000d;padding:.7em 1.2em;border-radius:10px;z-index:50;font-weight:650}
.foot{margin:24px 0 8px;font-size:.8em;color:var(--mut);text-align:center}
.lk table{width:100%;border-collapse:collapse;font-size:.9em}
.lk td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.lk td:first-child{white-space:nowrap;color:var(--brass2);font-weight:700;padding-right:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   Verriegelt! 1914–1918 – digitaler Escape-Room zum Ersten Weltkrieg
   Ein Gerät pro Team. Kein Server, keine Daten nach außen.
   Spielstand bleibt im Browser dieses Geräts.
   ============================================================ */
const KEY = "escape-weltkrieg-v1";
const HINT_PENALTY = 60;
const TEACHER_CODE = "LK1914";
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Z0-9]/g, "");
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} },
  del(){ try{ localStorage.removeItem(KEY); }catch(e){} }
};
function toast(msg, ms=2200){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function shuffle(a){ a = a.slice(); for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

/* ---------- Grafiken ---------- */
const FR = `<rect x="6" y="6" width="108" height="108" rx="10" fill="#1c1f17" stroke="#c9a45c" stroke-width="2"/>`;
const SVG = {

    <path d="M0 92 ${Array.from({length:29},(_,i)=>`Q${i*20+10} ${i%2?78:106} ${i*20+20} 92`).join(" ")}" fill="none" stroke="#6b6a52" stroke-width="2"/>
    ${Array.from({length:28},(_,i)=>`<path d="M${i*20+16} 86 l6 10 M${i*20+22} 86 l-6 10" stroke="#8a896c" stroke-width="1.6"/>`).join("")}
    <g transform="translate(372 96)"><path d="M0 22 q-2 -14 0 -22" stroke="#4f6b3a" stroke-width="2.5" fill="none"/><circle cx="-6" cy="-4" r="8" fill="#c2382c"/><circle cx="6" cy="-4" r="8" fill="#c2382c"/><circle cx="0" cy="-10" r="8" fill="#d6463a"/><circle cx="0" cy="2" r="7" fill="#b02f25"/><circle cx="0" cy="-3" r="3.2" fill="#1a1410"/></g>
    <g transform="translate(160 104)"><path d="M0 18 q1 -12 0 -18" stroke="#4f6b3a" stroke-width="2" fill="none"/><circle cx="-5" cy="-3" r="6" fill="#c2382c"/><circle cx="5" cy="-3" r="6" fill="#c2382c"/><circle cx="0" cy="-8" r="6" fill="#d6463a"/><circle cx="0" cy="-2" r="2.5" fill="#1a1410"/></g>
  </svg>`,
  train: `<svg viewBox="0 0 120 120">${FR}<rect x="22" y="44" width="62" height="34" rx="4" fill="#4b5139" stroke="#c9a45c" stroke-width="2"/><rect x="84" y="54" width="16" height="24" rx="3" fill="#4b5139" stroke="#c9a45c" stroke-width="2"/><rect x="30" y="50" width="12" height="10" fill="#e6cd8e"/><rect x="48" y="50" width="12" height="10" fill="#e6cd8e"/><rect x="66" y="50" width="12" height="10" fill="#e6cd8e"/><circle cx="36" cy="84" r="7" fill="#1c1f17" stroke="#c9a45c" stroke-width="2"/><circle cx="72" cy="84" r="7" fill="#1c1f17" stroke="#c9a45c" stroke-width="2"/><path d="M18 92 H104" stroke="#c9a45c" stroke-width="2"/><g fill="#d6463a"><circle cx="40" cy="40" r="3"/><circle cx="54" cy="38" r="3"/><circle cx="68" cy="40" r="3"/></g><path d="M92 50 v-12 q4 -6 8 -2" stroke="#a9a796" stroke-width="3" fill="none"/></svg>`,
  map: `<svg viewBox="0 0 120 120">${FR}<path d="M22 30 L46 24 L72 32 L98 26 V90 L72 96 L46 88 L22 94 Z" fill="#e6cd8e" stroke="#c9a45c" stroke-width="2"/><path d="M46 24 V88 M72 32 V96" stroke="#b39a62" stroke-width="1.5"/><circle cx="40" cy="56" r="7" fill="#5a6a9a"/><circle cx="80" cy="50" r="7" fill="#8b2d22"/><path d="M47 56 H73" stroke="#2b2418" stroke-width="2" stroke-dasharray="4 3"/><path d="M80 57 L66 78" stroke="#2b2418" stroke-width="2" stroke-dasharray="4 3"/><circle cx="62" cy="80" r="5" fill="#5a6a9a"/></svg>`,
  shovel: `<svg viewBox="0 0 120 120">${FR}<path d="M20 88 Q60 72 100 88" stroke="#6b6a52" stroke-width="3" fill="none"/><path d="M20 96 H100" stroke="#4b5139" stroke-width="6"/><path d="M76 24 L52 72" stroke="#c9a45c" stroke-width="5" stroke-linecap="round"/><path d="M44 68 L60 76 L50 96 Q42 98 38 90 Z" fill="#8a896c" stroke="#c9a45c" stroke-width="2"/><path d="M70 22 h14" stroke="#c9a45c" stroke-width="5" stroke-linecap="round"/><path d="M84 52 q8 -10 16 0" stroke="#e6cd8e" stroke-width="2" fill="none" opacity=".6"/></svg>`,
  trench: `<svg viewBox="0 0 120 120">${FR}<path d="M14 54 H40 V84 H80 V54 H106" fill="none" stroke="#c9a45c" stroke-width="3"/><path d="M40 84 H80 V92 H40 Z" fill="#4a3a26"/><path d="M14 54 H40 V60 H14Z M80 54 H106 V60 H80Z" fill="#6b5a3a"/><path d="M20 44 l6 8 M26 44 l-6 8 M34 44 l6 8 M40 44 l-6 8 M86 44 l6 8 M92 44 l-6 8 M100 44 l6 8 M106 44 l-6 8" stroke="#a9a796" stroke-width="1.6"/><path d="M14 48 Q30 40 46 48 M74 48 Q90 40 106 48" stroke="#8a896c" fill="none" stroke-width="1.5"/><path d="M56 84 v-14 q4 -4 8 0 v14" fill="#3d4230"/><circle cx="60" cy="66" r="4" fill="#8a896c"/></svg>`,
  crater: `<svg viewBox="0 0 120 120">${FR}<path d="M14 70 Q32 56 50 70 Q60 92 74 70 Q92 54 106 70 V100 H14Z" fill="#3a2f22"/><path d="M14 70 Q32 56 50 70 Q60 92 74 70 Q92 54 106 70" fill="none" stroke="#6b5a3a" stroke-width="2"/><path d="M30 64 V40 M24 46 h12" stroke="#8a896c" stroke-width="3"/><path d="M88 62 V34 L84 30 M88 44 L94 38" stroke="#5d5442" stroke-width="3" fill="none"/><path d="M58 30 q4 -10 10 -4 q6 -8 10 2" stroke="#a9a796" stroke-width="2" fill="none" opacity=".7"/></svg>`,
  gasmask: `<svg viewBox="0 0 120 120">${FR}<path d="M60 24 C34 24 30 50 34 66 C38 84 48 96 60 96 C72 96 82 84 86 66 C90 50 86 24 60 24Z" fill="#4b5139" stroke="#c9a45c" stroke-width="2"/><circle cx="47" cy="54" r="10" fill="#1c1f17" stroke="#e6cd8e" stroke-width="3"/><circle cx="73" cy="54" r="10" fill="#1c1f17" stroke="#e6cd8e" stroke-width="3"/><rect x="50" y="76" width="20" height="22" rx="6" fill="#6b6a52" stroke="#c9a45c" stroke-width="2"/><path d="M52 82 h16 M52 88 h16 M52 94 h16" stroke="#3d4230" stroke-width="1.5"/></svg>`,
  tank: `<svg viewBox="0 0 120 120">${FR}<path d="M14 84 L26 50 Q30 42 40 42 H86 Q94 42 98 50 L108 84 Q104 92 96 92 H26 Q16 92 14 84Z" fill="#5a5e44" stroke="#c9a45c" stroke-width="2"/><path d="M24 80 Q60 68 98 80" stroke="#2f321f" stroke-width="2" fill="none"/>${Array.from({length:9},(_,i)=>`<circle cx="${26+i*9.5}" cy="84" r="3" fill="#2f321f"/>`).join("")}<rect x="48" y="52" width="22" height="18" rx="2" fill="#6b6f52" stroke="#c9a45c" stroke-width="1.5"/><path d="M70 60 H84" stroke="#2f321f" stroke-width="4"/><path d="M6 100 Q60 94 114 100" stroke="#6b6a52" stroke-width="2" fill="none"/></svg>`,
  exit: `<svg viewBox="0 0 120 120">${FR}<rect x="34" y="22" width="52" height="78" rx="3" fill="#2a2a1e" stroke="#c9a45c" stroke-width="2"/><rect x="40" y="28" width="40" height="72" fill="#4b5139"/><circle cx="72" cy="66" r="3" fill="#e6cd8e"/><rect x="38" y="10" width="44" height="10" rx="2" fill="#2f6b3a"/><text x="60" y="18" font-size="8" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">AUSGANG</text></svg>`,
  door: `<svg viewBox="0 0 120 120" class="door"><rect x="30" y="14" width="60" height="96" rx="3" fill="#0e0f0b" stroke="#c9a45c" stroke-width="3"/><g style="transform-origin:32px 60px;animation:open 1.1s .2s ease-in-out both"><rect x="32" y="16" width="56" height="92" rx="2" fill="#4b5139" stroke="#c9a45c" stroke-width="2"/><rect x="40" y="26" width="40" height="30" rx="2" fill="none" stroke="#8a896c" stroke-width="1.5"/><rect x="40" y="64" width="40" height="34" rx="2" fill="none" stroke="#8a896c" stroke-width="1.5"/><circle cx="80" cy="62" r="3" fill="#e6cd8e"/></g><style>@keyframes open{to{transform:perspective(200px) rotateY(-70deg)}}</style><path d="M34 108 L60 60 L86 108" fill="#e6cd8e" opacity=".14"/></svg>`
};

/* ============================================================
   RÄUME & RÄTSEL
   ============================================================ */
const letterDoc = (date, html, sig="Dein Paul", stamp="FELDPOST") => ({ cls: "letter", title: "Feldpost von Paul", html: `<span class="stamp">${stamp}</span><p class="date">${date}</p>${html}<p class="sig">${sig}</p>` });
const ROOMS = [
  {

let S = store.get();
let tick = null;
function fresh(team, limit){ return { team, limit, start: Date.now(), room: 0, step: 0, hints: {}, penalty: 0, wrong: 0, letters: [], solved: [], end: null, order: {} }; }
function save(){ store.set(S); }
function elapsed(){ return Math.floor(((S.end || Date.now()) - S.start) / 1000) + S.penalty; }
const mmss = s => `${Math.floor(Math.abs(s)/60)}:${String(Math.abs(s)%60).padStart(2,"0")}`;
function confirmBox(text, ok, fn){
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="card col"><p style="font-size:1.1em;margin:0">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button data-c>Abbrechen</button><button class="btn-main" data-o>${esc(ok)}</button></div></div>`;
  document.body.appendChild(o);
  o.querySelector("[data-c]").onclick = () => o.remove();
  o.querySelector("[data-o]").onclick = () => { o.remove(); fn(); };
}

      <button class="btn-main btn-xl" id="go">Spiel starten</button>
    </div>
    <div class="foot"><button class="btn-ghost btn-sm" id="lk">🎓 Für Lehrkräfte</button><br>Paul, Karl, das Museum und euer Team sind erfunden – die historischen Ereignisse und Zahlen sind echt.</div>
  </div>`;
  document.getElementById("go").onclick = () => {
    const team = document.getElementById("team").value.trim().slice(0, 30);
    if(!team){ toast("Bitte gebt einen Teamnamen ein."); document.getElementById("team").focus(); return; }
    const go = () => { S = fresh(team, +document.getElementById("limit").value); save(); renderRoom(); };
    if(running) confirmBox("Das laufende Spiel wird gelöscht. Neues Spiel starten?", "Neu starten", go); else go();
  };
  document.getElementById("team").onkeydown = e => { if(e.key === "Enter") document.getElementById("go").click(); };
  if(running){
    document.getElementById("cont").onclick = renderRoom;
    document.getElementById("reset").onclick = () => confirmBox("Wirklich alles löschen und neu beginnen?", "Neu starten", () => { store.del(); S = null; renderStart(); });
  }
  document.getElementById("lk").onclick = renderTeacher;
}

/* ============================================================
   RAUM
   ============================================================ */
function topbar(){
  const n = ROOMS.filter(r => r.letter).length;
  return `<div class="top"><div class="wrap">
    <div class="brand">🔒 Verriegelt! 1914–1918</div>
    <span class="pill">👥 ${esc(S.team)}</span>
    <span class="pill timer" id="timer"></span>
    <div class="grow"></div>
    <div class="letters" title="Gesammelte Buchstaben">${Array.from({length: n}, (_, i) => `<div class="slot ${S.letters[i] ? "full" : ""}">${S.letters[i] || ""}</div>`).join("")}</div>
  </div></div>`;
}
function pathHtml(){
  return `<div class="path">${ROOMS.map((r, i) => `${i ? `<div class="ln ${i <= S.room ? "done" : ""}"></div>` : ""}<div class="st ${i < S.room ? "done" : i === S.room ? "cur" : ""}" title="${esc(r.title)}">${i < S.room ? "✓" : i + 1}</div>`).join("")}</div>`;
}
function updTimer(){
  const el = document.getElementById("timer"); if(!el || !S) return;
  const e = elapsed();
  if(S.limit){
    const left = S.limit*60 - e;
    el.textContent = left >= 0 ? `⏳ ${mmss(left)}` : `⚠ +${mmss(left)}`;
    el.classList.toggle("warn", left < 120);
    if(left < 0 && !S.overWarned){ S.overWarned = true; save(); toast("Die Zeit ist abgelaufen! Ihr dürft weiterspielen – die Zeit wird notiert.", 4500); }
  } else el.textContent = `⏱ ${mmss(e)}`;
}
function renderRoom(){
  clearInterval(tick);
  const R = ROOMS[S.room];
  const used = S.hints[R.id] || 0;
  const docHtml = d => d ? `<div class="doc ${d.cls || ""}"><h3>${d.cls === "letter" ? "✉" : "📜"} ${esc(d.title)}</h3>${d.html}</div>` : "";
  $app.innerHTML = topbar() + `
  <div class="wrap col">
    ${pathHtml()}
    <div class="card col">
      <div class="roomhead">${R.icon}<div><div class="place">${esc(R.place)}</div><h1>${esc(R.title)}</h1></div></div>
      <div class="story">${R.story}</div>
      ${docHtml(R.doc)}
      ${R.facts ? `<div class="facts">${R.facts}</div>` : ""}
      <div class="puzzle" id="puzzle"></div>
      <div class="hintbox" id="hints">${R.hints.slice(0, used).map(h => `<div class="hint">💡 ${esc(h)}</div>`).join("")}</div>
      <div class="row"><button class="btn-sm" id="hintbtn" ${used >= R.hints.length ? "disabled" : ""}>💡 Hinweis ${used < R.hints.length ? `(${used+1}/${R.hints.length}, +1 Min.)` : "– keine weiteren"}</button><div class="grow"></div><button class="btn-ghost btn-sm" id="menu">Menü</button></div>
    </div>
  </div>`;
  updTimer(); tick = setInterval(updTimer, 1000);
  document.getElementById("hintbtn").onclick = () => {
    const n = S.hints[R.id] || 0; if(n >= R.hints.length) return;
    S.hints[R.id] = n + 1; S.penalty += HINT_PENALTY; save(); renderRoom();
    const last = document.querySelector("#hints .hint:last-child"); last && last.scrollIntoView({ behavior: "smooth", block: "center" });
  };
  document.getElementById("menu").onclick = renderStart;
  renderPuzzle(R, R.puzzles[S.step], document.getElementById("puzzle"));
}
function fail(el, fb, msg){
  S.wrong++; save();
  fb.className = fb.className.replace(/\b(good|bad)\b/g, "") + " bad"; fb.textContent = msg;
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
}
const WRONG = ["Das Schloss bleibt zu. Versucht es noch einmal.", "Falsch – die Tür rührt sich nicht.", "Leider nicht. Lest die Vitrine noch einmal genau.", "Das stimmt noch nicht."];
const wrongMsg = () => WRONG[Math.floor(Math.random()*WRONG.length)];
function stepDone(R){
  if(S.step + 1 < R.puzzles.length){ S.step++; save(); toast("Richtig! ✓"); renderRoom(); document.getElementById("puzzle").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  roomDone(R);
}
function orderFor(R, n){ const k = R.id + S.step; if(!S.order[k] || S.order[k].length !== n){ S.order[k] = shuffle([...Array(n).keys()]); save(); } return S.order[k]; }
function renderPuzzle(R, P, el){
  const prog = R.puzzles.length > 1 ? `<div class="mut small" style="margin-bottom:4px">Aufgabe ${S.step+1} von ${R.puzzles.length}</div>` : "";
  if(P.type === "text"){
    el.innerHTML = prog + `<div class="q">🔒 ${esc(P.q)}</div>
      ${P.showLetters ? `<p class="mut">Eure Buchstaben: <b style="color:var(--brass2);letter-spacing:.35em;font-family:var(--type);font-size:1.35em">${S.letters.join(" ")}</b></p>` : ""}
      <div class="textans"><input id="ans" placeholder="${esc(P.placeholder || "Antwort")}" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn-main" id="chk">Öffnen</button></div>
      <div class="feedback" id="fb"></div>`;
    const inp = el.querySelector("#ans"), fb = el.querySelector("#fb");
    const check = () => { if(!inp.value.trim()) return; if(P.answer.map(norm).includes(norm(inp.value))) stepDone(R); else fail(inp, fb, wrongMsg()); };
    el.querySelector("#chk").onclick = check; inp.onkeydown = e => { if(e.key === "Enter") check(); };
  }
  else if(P.type === "multi"){
    const need = P.options.filter(o => o[1]).length, order = orderFor(R, P.options.length), sel = new Set();
    el.innerHTML = prog + `<div class="q">${esc(P.q)}</div>
      <div class="opts">${order.map(i => `<button class="opt" data-i="${i}"><span class="box"></span><span>${esc(P.options[i][0])}</span></button>`).join("")}</div>
      <div class="row" style="margin-top:10px"><span class="mut small grow" id="cnt">0 von ${need} ausgewählt</span><button class="btn-main" id="chk">Prüfen</button></div>
      <div class="feedback" id="fb"></div>`;
    const fb = el.querySelector("#fb");
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const i = +b.dataset.i; if(sel.has(i)) sel.delete(i); else sel.add(i);
      b.classList.toggle("on", sel.has(i)); b.querySelector(".box").textContent = sel.has(i) ? "✓" : "";
      el.querySelector("#cnt").textContent = `${sel.size} von ${need} ausgewählt`; fb.textContent = "";
    });
    el.querySelector("#chk").onclick = () => {
      if(sel.size !== need){ fb.className = "feedback bad"; fb.textContent = `Wählt genau ${need} Antworten aus.`; return; }
      const right = [...sel].filter(i => P.options[i][1]).length;
      if(right === need) stepDone(R); else fail(el.querySelector(".opts"), fb, `${right} von ${need} sind richtig – aber noch nicht alle.`);
    };
  }
  else if(P.type === "choice"){
    const order = orderFor(R, P.options.length);
    el.innerHTML = prog + `<div class="q">${esc(P.q)}</div>
      <div class="opts">${order.map(i => `<button class="opt radio" data-i="${i}"><span class="box"></span><span>${esc(P.options[i][0])}</span></button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    const fb = el.querySelector("#fb");
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if(P.options[+b.dataset.i][1]){ b.classList.add("on"); b.querySelector(".box").textContent = "✓"; setTimeout(() => stepDone(R), 350); }
      else fail(b, fb, wrongMsg());
    });
  }
  else if(P.type === "code"){
    const n = P.answer.length, v = Array(n).fill(0);
    el.innerHTML = prog + `<div class="q">🔢 ${esc(P.q)}</div>
      <div class="lock" id="lock">${v.map((_, i) => `<div class="wheel"><button data-i="${i}" data-d="1" aria-label="hoch">▲</button><div class="d" id="d${i}">0</div><button data-i="${i}" data-d="-1" aria-label="runter">▼</button></div>`).join("")}</div>
      <div class="center"><button class="btn-main" id="chk">Schloss öffnen</button></div>
      <div class="feedback center" id="fb"></div>`;
    el.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { const i = +b.dataset.i; v[i] = (v[i] + (+b.dataset.d) + 10) % 10; el.querySelector("#d" + i).textContent = v[i]; el.querySelector("#fb").textContent = ""; });
    el.querySelector("#chk").onclick = () => { if(v.join("") === P.answer) stepDone(R); else fail(el.querySelector("#lock"), el.querySelector("#fb"), "Klack – das Schloss bleibt zu."); };
  }
  else if(P.type === "sort"){
    const place = {}, order = orderFor(R, P.items.length); let selected = null;
    const cols = P.cats.length === 2 ? "1fr 1fr" : "repeat(auto-fit,minmax(170px,1fr))";
    const draw = () => {
      el.innerHTML = prog + `<div class="q">${esc(P.q)}</div>
        <div class="pool">${order.filter(i => place[i] == null).map(i => `<button class="chipx ${selected === i ? "sel" : ""}" data-i="${i}">${esc(P.items[i][0])}</button>`).join("") || `<span class="mut small">Alles zugeordnet – jetzt prüfen!</span>`}</div>
        <div class="cats" style="grid-template-columns:${cols}">${P.cats.map((c, k) => `<div class="cat ${selected != null ? "target" : ""}" data-k="${k}"><h4>${esc(c[0])}</h4>${c[1] ? `<div class="sub">${esc(c[1])}</div>` : ""}<div class="in">${order.filter(i => place[i] === k).map(i => `<button class="chipx" data-i="${i}">${esc(P.items[i][0])}</button>`).join("")}</div></div>`).join("")}</div>
        <div class="row" style="margin-top:10px"><span class="mut small grow">${Object.keys(place).length} von ${P.items.length} zugeordnet</span><button class="btn-main" id="chk" ${Object.keys(place).length < P.items.length ? "disabled" : ""}>Prüfen</button></div>
        <div class="feedback" id="fb"></div>`;
      el.querySelectorAll(".chipx").forEach(b => b.onclick = ev => {
        ev.stopPropagation(); const i = +b.dataset.i;
        if(place[i] != null && selected != null && selected !== i){ place[selected] = place[i]; selected = null; }
        else if(place[i] != null){ delete place[i]; selected = i; }
        else selected = selected === i ? null : i;
        draw();
      });
      el.querySelectorAll(".cat").forEach(c => c.onclick = () => { if(selected == null){ toast("Tippt zuerst eine Karte an."); return; } place[selected] = +c.dataset.k; selected = null; draw(); });
      const chk = el.querySelector("#chk");
      if(chk) chk.onclick = () => {
        const wrong = Object.keys(place).map(Number).filter(i => P.items[i][1] !== place[i]);
        if(!wrong.length){ stepDone(R); return; }
        wrong.forEach(i => delete place[i]); draw();
        fail(el.querySelector(".cats"), el.querySelector("#fb"), `${wrong.length} ${wrong.length === 1 ? "Karte war" : "Karten waren"} falsch zugeordnet und ${wrong.length === 1 ? "liegt" : "liegen"} wieder oben.`);
      };
    };
    draw();
  }
  else if(P.type === "order"){
    const order = orderFor(R, P.items.length); let seq = [];
    const draw = () => {
      el.innerHTML = prog + `<div class="q">${esc(P.q)}</div>
        <div class="seq">${P.items.map((_, k) => seq[k] != null ? `<div class="slotline filled" data-k="${k}"><span class="n">${k+1}</span><span>${esc(P.items[seq[k]])}</span></div>` : `<div class="slotline"><span class="n">${k+1}</span><span class="mut small">…</span></div>`).join("")}</div>
        <div class="mut small">Zur Auswahl (antippen):</div>
        <div class="seq">${order.filter(i => !seq.includes(i)).map(i => `<button class="seqitem" data-i="${i}"><span>${esc(P.items[i])}</span></button>`).join("") || `<span class="mut small">Alles eingeordnet – jetzt prüfen! (Antippen oben nimmt einen Eintrag wieder heraus.)</span>`}</div>
        <div class="row"><span class="grow"></span><button class="btn-main" id="chk" ${seq.length < P.items.length ? "disabled" : ""}>Prüfen</button></div>
        <div class="feedback" id="fb"></div>`;
      el.querySelectorAll(".seqitem").forEach(b => b.onclick = () => { seq.push(+b.dataset.i); draw(); });
      el.querySelectorAll(".slotline.filled").forEach(s => s.onclick = () => { seq = seq.slice(0, +s.dataset.k); draw(); });
      const chk = el.querySelector("#chk");
      if(chk) chk.onclick = () => {
        let ok = 0; while(ok < seq.length && seq[ok] === ok) ok++;
        if(ok === P.items.length){ stepDone(R); return; }
        seq = seq.slice(0, ok); draw();
        fail(el.querySelector(".seq"), el.querySelector("#fb"), ok ? `Die ersten ${ok} stimmen – ab Schritt ${ok+1} geht es anders weiter.` : "Schon der erste Schritt stimmt nicht.");
      };
    };
    draw();
  }
  else if(P.type === "cloze"){
    const words = shuffle(P.answers.concat(P.extra || []));
    el.innerHTML = prog + `<div class="q">${esc(P.q)}</div>
      <div class="doc"><h3>📜 Infotafel</h3><div class="cloze">${P.parts.map(p => typeof p === "number" ? `<select data-g="${p}"><option value="">– wählen –</option>${words.map(w => `<option>${esc(w)}</option>`).join("")}</select>` : esc(p)).join("")}</div></div>
      <div class="row" style="margin-top:10px"><span class="grow"></span><button class="btn-main" id="chk">Prüfen</button></div>
      <div class="feedback" id="fb"></div>`;
    el.querySelectorAll("select").forEach(s => s.onchange = () => { s.classList.remove("wrong", "right"); el.querySelector("#fb").textContent = ""; });
    el.querySelector("#chk").onclick = () => {
      const sels = [...el.querySelectorAll("select")];
      if(sels.some(s => !s.value)){ const fb = el.querySelector("#fb"); fb.className = "feedback bad"; fb.textContent = "Füllt zuerst alle Lücken aus."; return; }
      let wrong = 0;
      sels.forEach(s => { const ok = s.value === P.answers[+s.dataset.g]; s.classList.toggle("right", ok); s.classList.toggle("wrong", !ok); if(!ok) wrong++; });
      if(!wrong) setTimeout(() => stepDone(R), 400);
      else fail(el.querySelector(".cloze"), el.querySelector("#fb"), `${wrong} ${wrong === 1 ? "Lücke ist" : "Lücken sind"} noch falsch (rot markiert).`);
    };
  }
}
function roomDone(R){
  clearInterval(tick);
  if(R.letter) S.letters.push(R.letter);
  S.solved.push(R.id);
  if(S.room + 1 >= ROOMS.length){ S.end = Date.now(); S.room = ROOMS.length; S.step = 0; save(); renderEnd(true); return; }
  S.room++; S.step = 0; save();
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="card col center">
    ${SVG.door}
    <h2>Die Tür ist offen!</h2>
    <p style="text-align:left">${R.success}</p>
    ${R.letter ? `<div><span class="mut">Im Türrahmen klebt ein Buchstabe:</span><div class="bigletter">${R.letter}</div></div>` : ""}
    <div class="merk" style="text-align:left">📌 ${R.merk}</div>
    <button class="btn-main btn-xl" id="next">Weiter: ${esc(ROOMS[S.room].title)} ➜</button>
  </div>`;
  document.body.appendChild(o);
  renderRoom();
  o.querySelector("#next").onclick = () => { o.remove(); window.scrollTo({ top: 0, behavior: "smooth" }); };
}

/* ============================================================
   ENDE
   ============================================================ */
function renderEnd(isNew){
  clearInterval(tick);
  const e = elapsed(), hints = Object.values(S.hints).reduce((a,b) => a+b, 0);
  const inTime = !S.limit || e <= S.limit*60;
  $app.innerHTML = `
  <div class="wrap col">
    <div class="center">${SVG.hero}<div class="title-xl">Ihr seid <span>draußen.</span></div></div>
    <div class="card col">
      <p class="story">Die Ausgangstür springt auf, das Licht geht wieder an. In der letzten Vitrine neben dem Ausgang liegt noch eine Karte von Paul:</p>
      <div class="doc letter"><span class="stamp">LAZARETT</span><p class="date">Dresden, Frühjahr 1917</p><p>Liebe Mutter,</p><p>sie schicken mich nach Hause. Das Bein wird nicht mehr richtig, sagen die Ärzte. Ich weiß nicht, ob ich mich freuen soll. Von uns zwölf, die im August 1914 am Bahnhof standen, sind noch drei am Leben. Bitte frag mich nie, wie es dort war.</p><p class="sig">Dein Paul</p></div>
      <p class="story">Am <b>11. November 1918</b> endete der Krieg mit einem Waffenstillstand. Rund <b>17 Millionen Menschen</b> waren gestorben, darunter etwa 2 Millionen deutsche Soldaten. Viele Historiker nennen den Ersten Weltkrieg die „Urkatastrophe des 20. Jahrhunderts“.</p>
      <p class="story mut">Die rote Mohnblume ist bis heute in vielen Ländern ein Zeichen der Erinnerung an die Toten des Ersten Weltkriegs: Sie blühte auf den zerwühlten Schlachtfeldern Flanderns.</p>
    </div>
    <div class="cert">
      <div style="letter-spacing:.2em;font-size:.8em">URKUNDE</div>
      <h2>Team „${esc(S.team)}“</h2>
      <div>hat am ${new Date(S.end).toLocaleDateString("de-DE")} alle Säle der Ausstellung „1914–1918“ gelöst${inTime ? " – in der vorgegebenen Zeit!" : "."}</div>
      <div class="stats"><div><span class="small">Zeit</span><b>${mmss(e)}</b></div><div><span class="small">Hinweise</span><b>${hints}</b></div><div><span class="small">Fehlversuche</span><b>${S.wrong}</b></div></div>
      <div class="small">Die Zeit enthält ${hints} Min. Strafzeit für Hinweise.</div>
    </div>
    <div class="card col">
      <h2>📌 Das habt ihr gelernt</h2>
      ${ROOMS.map(r => `<div class="merk">${r.merk}</div>`).join("")}
    </div>
    <div class="row" style="justify-content:center"><button class="btn-main" id="again">Neues Spiel</button></div>
    <div class="foot">Paul, Karl, das Museum und euer Team sind erfunden – die historischen Ereignisse und Zahlen sind echt.</div>
  </div>`;
  document.getElementById("again").onclick = () => confirmBox("Ergebnis löschen und neues Spiel starten?", "Neues Spiel", () => { store.del(); S = null; renderStart(); });
}

/* ============================================================
   LEHRKRAFT-INFO
   ============================================================ */
function renderTeacher(){
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="card col lk">
    <h2>🎓 Für Lehrkräfte</h2>
    <p><b>Inhalt:</b> Wiederholung – „Mit Hurra in den Krieg“, Bündnissysteme, „Das Hurra verstummt“ (Marne, Stellungskrieg). Neu – Alltag im Schützengraben, Tod als Alltag (Verdun, Materialschlacht), Waffen (MG, Artillerie, Giftgas, Flammenwerfer), Panzer (Mark I, A7V) und als Ergebnis: der Erste Weltkrieg als technisierter, industrieller Krieg.</p>
    <p><b>Ablauf:</b> 8 Säle, ca. 35–45 Minuten. Teams aus 2–4 SuS teilen sich ein Gerät. Pro Saal gibt es drei Hinweise (je 1 Minute Strafzeit), der letzte verrät die Lösung. Die Merksätze am Ende eignen sich als Ergebnissicherung.</p>
    <p><b>Hinweis zum Inhalt:</b> Die Texte beschreiben Tod, Verwundung und die Wirkung der Waffen sachlich, aber deutlich (fiktive Feldpost, Tod eines Kameraden). Eine kurze Nachbesprechung ist sinnvoll.</p>
    <p><b>Technik:</b> Es werden keine Daten verschickt. Der Spielstand bleibt im Browser des Geräts.</p>
    <div id="sol"><div class="row"><input id="code" placeholder="Code für die Lösungen" autocomplete="off" class="grow"><button id="show">Lösungen zeigen</button></div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn-main" id="close">Schließen</button></div>
  </div>`;
  document.body.appendChild(o);
  o.querySelector("#close").onclick = () => o.remove();
  const show = () => {
    if(norm(o.querySelector("#code").value) !== norm(TEACHER_CODE)){ toast("Falscher Code."); return; }
    o.querySelector("#sol").innerHTML = `<table>
      <tr><td>1 Aufbruch</td><td>kurzer Krieg · Verteidigung · Abenteuer/Ruhm → K</td></tr>
      <tr><td>2 Bündnisse</td><td>Mittelmächte: Deutsches Reich, Österreich-Ungarn, Osmanisches Reich, Bulgarien · Rest: Entente · Reihenfolge: Attentat – Österreich-Ungarn gegen Serbien – Russland mobil – Deutschland gegen Russland/Frankreich – Belgien/Großbritannien → E</td></tr>
      <tr><td>3 Hurra verstummt</td><td>Code <b>700</b> · Stellungskrieg = eingraben, Front bewegt sich kaum → N</td></tr>
      <tr><td>4 Schützengraben</td><td>Niemandsland – Stacheldraht – Unterstand – Ratten – Grabenfuß → T</td></tr>
      <tr><td>5 Verdun</td><td>Code <b>1000</b> (300.000 : 300 Tage) · Materialschlacht → I</td></tr>
      <tr><td>6 Waffen</td><td>MG: 500 Schuss, Niemandsland · Artillerie: meiste Tote, Trommelfeuer · Giftgas: Ypern 1915, verätzt · Flammenwerfer: Öl, Nahkampf · Maschinen töten aus der Ferne → C</td></tr>
      <tr><td>7 Panzer</td><td>Code <b>8620</b> (8 Mann – 6 km/h – 20 A7V) · Stellungskrieg durchbrechen → H</td></tr>
      <tr><td>8 Ausgang</td><td>MG & Artillerie · neue Waffen · Fabriken · Eisenbahnen · Kennwort <b>TECHNIK</b> (K E N T I C H)</td></tr></table>`;
  };
  o.querySelector("#show").onclick = show;
  o.querySelector("#code").onkeydown = e => { if(e.key === "Enter") show(); };
}

/* ---------- Start ---------- */
if(S && S.end) renderEnd(false); else renderStart();
</script>
