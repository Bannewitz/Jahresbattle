<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Überlebst du die Altsteinzeit?</title>
<style>
:root{--dunkel:#2a241d;--ocker:#c98a3a;--ocker2:#e6b45e;--gruen:#4f7d3a;--rot:#b0402e;--gelb:#d39a1e;--creme:#f7f0e1;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--serif:Georgia,"Palatino Linotype",serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:#2a241d;color:var(--dunkel);font-size:18px;line-height:1.5;min-height:100vh}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
header{background:#1e1914;color:#f3e7d0;display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap;border-bottom:3px solid var(--ocker);position:sticky;top:0;z-index:20}
header h1{font:normal 1.2rem var(--serif);margin:0;flex:1;min-width:180px}
.werte{display:flex;gap:14px;flex-wrap:wrap}
.wert{display:flex;align-items:center;gap:6px;font-size:.85rem;position:relative}
.wert .ic{font-size:1.25rem}
.balken{display:flex;gap:2px}
.balken i{width:11px;height:16px;border-radius:3px;background:#4a4036;transition:background .4s}
.wert.n .balken i.an{background:#d9893a}.wert.w .balken i.an{background:#e0553a}.wert.g .balken i.an{background:#5aa04a}
.wert.knapp .balken i.an{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.delta{position:absolute;right:-6px;top:-14px;font-weight:700;font-size:.95rem;animation:hoch 1.6s ease-out forwards;pointer-events:none}
.delta.plus{color:#8fd47a}.delta.minus{color:#ff8a7a}
@keyframes hoch{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.zeiten{display:flex;gap:4px}
.zeiten span{padding:3px 9px;border-radius:999px;font-size:.8rem;background:#3a3129;opacity:.55}
.zeiten span.an{opacity:1;background:var(--ocker2);color:var(--dunkel);font-weight:700}

main{max-width:1100px;margin:0 auto;padding:16px}
.karte{background:var(--creme);border-radius:16px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.bild{position:relative;background:#cfc7b0}
.bild svg{display:block;width:100%;height:auto}
.bild .chip{position:absolute;left:14px;top:12px;background:rgba(30,25,20,.85);color:#f3e7d0;border-radius:999px;padding:5px 14px;font-weight:600;font-size:.95rem}
.bild .schritt{position:absolute;right:14px;top:12px;background:rgba(255,255,255,.88);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600}
.inhalt{padding:18px 26px 24px}
.inhalt h2{font:normal 1.8rem var(--serif);margin:0 0 .3em;color:#4a3420}
.inhalt p{margin:.4em 0}
.optionen{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;border:2px solid #d9c9a8;background:#fff;border-radius:14px;padding:12px 16px;transition:all .15s}
.opt:hover{border-color:var(--ocker);background:#fffaf0;transform:translateY(-1px)}
.opt b{flex:none;width:42px;height:42px;border-radius:50%;background:var(--dunkel);color:var(--ocker2);display:flex;align-items:center;justify-content:center;font:1.3rem var(--serif)}
.ergebnis{border-radius:14px;padding:14px 18px;margin-top:14px;border-left:7px solid}
.ergebnis.gut{background:#e6f1e1;border-color:var(--gruen)}
.ergebnis.mittel{background:#fbf0d8;border-color:var(--gelb)}
.ergebnis.schlecht{background:#f8e2dc;border-color:var(--rot)}
.urteil{font:1.35rem var(--serif);margin:0 0 .2em}
.gut .urteil{color:var(--gruen)}.mittel .urteil{color:#9a6a0e}.schlecht .urteil{color:var(--rot)}
.wahl{font-size:.9rem;color:#6b5a45;font-style:italic}
.effekte{display:flex;gap:8px;flex-wrap:wrap;margin:.6em 0 .2em}
.eff{border-radius:999px;padding:3px 12px;font-weight:700;font-size:.95rem;background:#fff}
.eff.plus{color:#2f6b26}.eff.minus{color:var(--rot)}
.fakt{background:#fff;border:2px dashed var(--ocker);border-radius:12px;padding:12px 16px;margin-top:14px}
.fakt h4{margin:0 0 4px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:#8a5a1a}
.weiter{display:flex;justify-content:flex-end;margin-top:16px}
.btn{border:none;border-radius:999px;background:var(--dunkel);color:#fff;padding:12px 26px;font-weight:700;font-size:1.05rem}
.btn:hover{background:#4a3f33}
.btn.ocker{background:var(--ocker2);color:var(--dunkel)}
.btn.ocker:hover{background:#f0c272}
.btn.hell{background:#fff;color:var(--dunkel);border:2px solid var(--dunkel)}
.start-inhalt label{display:block;font-weight:700;margin:16px 0 6px}
.start-inhalt input{font:inherit;padding:10px 14px;border:2px solid #d9c9a8;border-radius:10px;width:100%;max-width:420px;background:#fff}
.vorschlaege{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vorschlaege button{border:1.5px solid #d9c9a8;background:#fff;border-radius:999px;padding:4px 12px;font-size:.88rem}
.regeln{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.regeln div{background:#fff;border-radius:12px;padding:10px 12px;font-size:.92rem}
.regeln b{display:block;font-size:1.05rem}
details.lk{margin-top:18px;border-top:1px solid #e3d5b8;padding-top:10px;font-size:.92rem}
details.lk summary{cursor:pointer;font-weight:700;color:#6b4a2a}
.urkunde{border:4px double var(--ocker);border-radius:12px;padding:18px 24px;background:#fffdf7;text-align:center;margin-top:10px}
.urkunde h3{font:normal 2rem var(--serif);margin:0;color:#4a3420}
.urkunde .sippe{font:1.5rem var(--serif);border-bottom:2px solid var(--ocker);display:inline-block;padding:0 18px;margin:6px 0}
.urkunde ol{text-align:left;max-width:720px;margin:12px auto 0}
.urkunde li{margin:.25em 0}
.sterne{font-size:2rem;letter-spacing:.15em;color:var(--ocker)}
.tabelle{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem;text-align:left}
.tabelle td{padding:5px 8px;border-bottom:1px solid #eadfca}
.punkt{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}
.aktionen{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
@media (max-width:640px){body{font-size:16px}.inhalt{padding:14px 16px 20px}.inhalt h2{font-size:1.4rem}.regeln{grid-template-columns:1fr}.balken i{width:7px;height:13px}.zeiten{display:none}header h1{font-size:1rem}}
@media print{header,.aktionen,.bild,.nicht-drucken{display:none!important}body{background:#fff}.karte{box-shadow:none}}
</style>
</head>
<body>
<header>
  <h1>Überlebst du die Altsteinzeit?</h1>
  <div class="zeiten" id="zeiten"><span data-z="fr">🌱 Frühling</span><span data-z="so">☀️ Sommer</span><span data-z="he">🍂 Herbst</span><span data-z="wi">❄️ Winter</span></div>
  <div class="werte" id="werte">
    <div class="wert n" id="wN"><span class="ic" title="Nahrung">🍖</span><span class="balken"></span></div>
    <div class="wert w" id="wW"><span class="ic" title="Wärme">🔥</span><span class="balken"></span></div>
    <div class="wert g" id="wG"><span class="ic" title="Gesundheit">❤️</span><span class="balken"></span></div>
  </div>
</header>
<main><div class="karte" id="karte"></div></main>

<script>
"use strict";
/* ================= Hilfen und Figuren ================= */
const L=(a,b,t)=>a+(b-a)*t, f1=n=>Math.round(n*10)/10;
const pts=a=>a.map(p=>f1(p[0])+','+f1(p[1])).join(' ');
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const HAUT=['#d9a77c','#c99167','#e3b88f','#b9845a'];
const HAAR=['#3a2615','#2a1c10','#5b3a1e','#7a5230'];
const FELL=['#8a6a45','#7a5a3a','#9b7b52','#6b4f33'];
const tf=(x,y,s,flip)=>`transform="translate(${f1(x)} ${f1(y)}) scale(${flip?-s:s} ${s})"`;
/* ================= Menschen ================= */
function mensch(x,y,s,o={}){
  const k=o.kleid||'#8a6a45',h=o.haut||'#d9a77c',hr=o.haar||'#3a2615',fell=o.fell;
  let g=`<g ${tf(x,y,s,o.flip)}>`;
  let dy=0;
  if(o.knie){dy=16;g+=`<path d="M-8 -6 L14 -6 L16 0" stroke="${fell?k:h}" stroke-width="7" stroke-linecap="round" fill="none"/>`;}
  else g+=`<path d="M-6 0 V-24 M6 0 V-24" stroke="${fell?'#5e4630':h}" stroke-width="6.5" stroke-linecap="round"/>`;
  g+=`<g transform="translate(0 ${dy})">`;
  g+=`<path d="M-13 -20 L-10 -50 Q0 -56 10 -50 L13 -20 Z" fill="${k}"/>`;
  if(fell)g+=`<path d="M-13 -21 L-10 -15 L-7 -21 L-4 -15 L-1 -21 L2 -15 L5 -21 L8 -15 L11 -21 L13 -21 L13 -22 L-13 -22Z" fill="${k}"/><path d="M-10 -50 Q0 -45 10 -50" stroke="#c8b08a" stroke-width="3" fill="none"/>`;
  else g+=`<path d="M-12.5 -26 H12.5" stroke="#8a6a45" stroke-width="2.4"/>`;
  const armL=o.armL||'M-9 -47 L-15 -27',armR=o.armR||'M9 -47 L15 -27';
  g+=`<path d="${armL} ${armR}" stroke="${fell?k:h}" stroke-width="5.5" stroke-linecap="round" fill="none"/>`;
  g+=`<circle cy="-60" r="8.5" fill="${h}"/>`;
  g+=o.lang?`<path d="M-9 -60 Q-10 -70 0 -70 Q10 -70 9 -60 L10 -46 Q7 -45 6 -50 L6 -61 Q0 -65 -6 -61 L-6 -50 Q-7 -45 -10 -46Z" fill="${hr}"/>`
           :`<path d="M-8.8 -60 Q-9 -70 0 -70 Q9 -70 8.8 -60 Q6 -65 0 -65 Q-6 -65 -8.8 -60Z" fill="${hr}"/>`;
  if(o.prop==='speer')g+=`<path d="M-2 -22 L30 -104" stroke="#7a5a35" stroke-width="3" stroke-linecap="round"/><path d="M27 -100 L34 -114 L33 -98Z" fill="#8f8c84"/>`;
  if(o.prop==='axt')g+=`<path d="M14 -62 L32 -92" stroke="#7a5a35" stroke-width="3.5" stroke-linecap="round"/><path d="M26 -96 Q34 -102 40 -92 Q34 -88 30 -88Z" fill="#6f7a74" stroke="#4d5550"/>`;
  if(o.prop==='sichel')g+=`<path d="M15 -27 L20 -20" stroke="#7a5a35" stroke-width="3"/><path d="M20 -20 Q34 -24 32 -38" stroke="#8f8c84" stroke-width="3" fill="none"/>`;
  if(o.prop==='korb')g+=`<path d="M-26 -32 Q-17 -14 -6 -32Z" fill="#a07a42" stroke="#6b4a2a"/><path d="M-26 -32 H-6" stroke="#6b4a2a" stroke-width="2"/>`;
  if(o.prop==='eimer')g+=`<path d="M15 -27 V-18" stroke="#6b4a2a" stroke-width="1.5"/><path d="M8 -18 L22 -18 L20 -4 L10 -4Z" fill="#8a6a45" stroke="#5e4630"/>`;
  if(o.prop==='beutel')g+=`<path d="M12 -28 Q8 -10 18 -8 Q28 -10 24 -28Z" fill="#7a5a3a" stroke="#4e3826"/>`;
  if(o.prop==='topf')g+=`<path d="M8 -36 Q4 -24 10 -18 L22 -18 Q28 -24 24 -36Z" fill="#b5784a" stroke="#6b4428"/><path d="M8 -30 Q16 -25 24 -30" stroke="#5a3a22" stroke-width="1.4" fill="none"/>`;
  return g+'</g></g>';
}
/* ================= Tiere ================= */
function rentier(x,y,s,flip){return `<g ${tf(x,y,s,flip)}>
<path d="M-18 -30 L-20 0 M-10 -30 L-9 0 M14 -30 L13 0 M22 -30 L24 0" stroke="#5e5246" stroke-width="3.6" stroke-linecap="round"/>
<ellipse cy="-39" rx="28" ry="13" fill="#8c7f6c"/><ellipse cy="-32" rx="19" ry="6" fill="#cfc5b2"/>
<path d="M16 -48 L25 -64 L36 -61 L31 -38Z" fill="#ddd5c4"/>
<ellipse cx="38" cy="-63" rx="10" ry="5.4" fill="#7d705e" transform="rotate(22 38 -63)"/>
<path d="M33 -67 Q26 -85 17 -93 M27 -81 L19 -83 M30 -88 L33 -99 M39 -67 Q43 -87 51 -97 M43 -85 L51 -85 M47 -91 L45 -103" stroke="#e8dcc0" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M-27 -44 l-5 4" stroke="#ddd5c4" stroke-width="4"/></g>`;}
function wildpferd(x,y,s,flip){const f='#b8925e';return `<g ${tf(x,y,s,flip)}>
<path d="M-22 -26 L-24 0 M-14 -26 L-12 0 M14 -26 L12 0 M22 -26 L24 0" stroke="#4a3a2a" stroke-width="4" stroke-linecap="round"/>
<path d="M-28 -28 Q-30 -46 -12 -46 L16 -46 Q24 -46 26 -54 L34 -70 Q40 -74 44 -68 L42 -60 Q38 -58 36 -52 L30 -32 Q28 -24 20 -24 L-20 -24 Q-28 -24 -28 -28Z" fill="${f}"/>
<path d="M27 -55 L35 -71" stroke="#3a2a1a" stroke-width="5" stroke-linecap="round"/><ellipse cy="-30" rx="16" ry="4" fill="#e6d4b0"/>
<path d="M-28 -40 Q-36 -30 -34 -16" stroke="#3a2a1a" stroke-width="4" fill="none"/></g>`;}
function rind(x,y,s,f,flip){return `<g ${tf(x,y,s,flip)}>
<path d="M-22 -26 V0 M-12 -26 V0 M16 -26 V0 M24 -26 V0" stroke="${f}" stroke-width="6" stroke-linecap="round"/>
<path d="M-30 -30 Q-32 -54 -14 -54 L18 -54 Q30 -54 30 -40 L30 -28 Q28 -22 18 -22 L-20 -22 Q-30 -22 -30 -30Z" fill="${f}"/>
<path d="M27 -50 L44 -48 Q50 -40 46 -31 L35 -31 Z" fill="${f}" stroke="rgba(0,0,0,.25)"/>
<path d="M37 -50 Q35 -61 28 -61 M42 -50 Q47 -61 54 -59" stroke="#efe4c8" stroke-width="2.8" fill="none" stroke-linecap="round"/>
<path d="M-30 -46 Q-37 -34 -35 -18" stroke="${f}" stroke-width="3" fill="none"/><circle cx="41" cy="-42" r="1.6" fill="#111"/></g>`;}
function schaf(x,y,s,flip){let c='';for(const [cx,cy,r] of [[-14,-30,11],[-2,-35,12],[10,-31,11],[-8,-24,10],[6,-24,10],[16,-27,9]])c+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#ede6d6"/>`;
  return `<g ${tf(x,y,s,flip)}><path d="M-12 -18 V0 M-4 -18 V0 M8 -18 V0 M14 -18 V0" stroke="#3a3028" stroke-width="3.2"/>${c}<ellipse cx="28" cy="-32" rx="8" ry="6" fill="#3a3028"/><ellipse cx="23" cy="-36" rx="4" ry="2" fill="#3a3028"/></g>`;}
function ziege(x,y,s,flip){const f='#8a6a4a';return `<g ${tf(x,y,s,flip)}><path d="M-14 -20 V0 M-7 -20 V0 M10 -20 V0 M16 -20 V0" stroke="${f}" stroke-width="3.4"/>
<ellipse cy="-28" rx="20" ry="10" fill="${f}"/><path d="M14 -32 L22 -46 L30 -44 L26 -30Z" fill="${f}"/><ellipse cx="29" cy="-44" rx="7" ry="4.4" fill="#6e5238"/>
<path d="M24 -48 Q20 -58 14 -58 M27 -48 Q25 -60 20 -61" stroke="#d9cdb2" stroke-width="2.2" fill="none"/><path d="M31 -40 L30 -34" stroke="#4a3a2a" stroke-width="2.4"/><path d="M-20 -30 l-4 -6" stroke="${f}" stroke-width="3"/></g>`;}
function schwein(x,y,s,flip){const f='#5e4636';return `<g ${tf(x,y,s,flip)}><path d="M-12 -12 V0 M-4 -12 V0 M8 -12 V0 M14 -12 V0" stroke="${f}" stroke-width="4"/>
<ellipse cy="-22" rx="22" ry="13" fill="${f}"/><path d="M-12 -34 Q0 -40 14 -33" stroke="#3a2a20" stroke-width="3" fill="none"/><rect x="20" y="-26" width="8" height="8" rx="3" fill="#7a5e4a"/><path d="M12 -32 L18 -40 L20 -30Z" fill="#3a2a20"/><circle cx="16" cy="-25" r="1.5" fill="#111"/></g>`;}
function hund(x,y,s,flip){const f='#7a5a3a';return `<g ${tf(x,y,s,flip)}><path d="M-10 -10 V0 M-5 -10 V0 M7 -10 V0 M11 -10 V0" stroke="${f}" stroke-width="3"/>
<ellipse cy="-15" rx="15" ry="6.5" fill="${f}"/><circle cx="15" cy="-23" r="6.5" fill="${f}"/><path d="M19 -22 L26 -20 L19 -18Z" fill="${f}"/><path d="M12 -28 L13 -35 L17 -28Z" fill="#5a4028"/><path d="M-14 -17 Q-22 -26 -17 -30" stroke="${f}" stroke-width="3" fill="none"/><circle cx="17" cy="-24" r="1.2" fill="#111"/></g>`;}

/* ================= Dinge ================= */
function laubbaum(x,y,s,c1='#4f8a3e',c2='#62a04c'){return `<g ${tf(x,y,s)}><rect x="-5" y="-50" width="10" height="50" fill="#6b4a2a"/><circle cx="-18" cy="-64" r="22" fill="${c1}"/><circle cx="16" cy="-66" r="24" fill="${c1}"/><circle cx="0" cy="-86" r="26" fill="${c2}"/><circle cx="-4" cy="-60" r="20" fill="${c2}"/></g>`;}
function nadelbaum(x,y,s,c='#3f6a45'){return `<g ${tf(x,y,s)}><rect x="-4" y="-22" width="8" height="22" fill="#5a3e24"/><path d="M-28 -18 L0 -62 L28 -18Z M-23 -46 L0 -90 L23 -46Z M-17 -74 L0 -112 L17 -74Z" fill="${c}"/></g>`;}
function birke(x,y,s){return `<g ${tf(x,y,s)}><rect x="-4" y="-80" width="8" height="80" fill="#efebe2"/><path d="M-4 -60h4M0 -40h4M-4 -22h5M0 -70h4" stroke="#333" stroke-width="2"/><circle cx="-10" cy="-88" r="15" fill="#a9b77a"/><circle cx="10" cy="-96" r="14" fill="#b9c486"/><circle cx="2" cy="-78" r="12" fill="#a9b77a"/></g>`;}
function stumpf(x,y,s){return `<g ${tf(x,y,s)}><path d="M-10 0 V-14 H10 V0Z" fill="#7a5a35"/><ellipse cy="-14" rx="10" ry="3.5" fill="#d8b98a"/></g>`;}
function busch(x,y,s,beeren){let b=`<g ${tf(x,y,s)}><circle cx="-16" cy="-16" r="16" fill="#5f7a3e"/><circle cx="14" cy="-18" r="17" fill="#5f7a3e"/><circle cx="0" cy="-30" r="18" fill="#6e8a48"/>`;
  if(beeren)for(const [bx,by] of [[-14,-20],[-4,-34],[8,-26],[18,-14],[-20,-8],[4,-12],[12,-36]])b+=`<circle cx="${bx}" cy="${by}" r="3" fill="#b5283a"/>`;return b+'</g>';}
function feuer(x,y,s){return `<g ${tf(x,y,s)}>${[[-26,0],[-14,6],[2,8],[18,6],[28,0],[-20,-6],[22,-6]].map(([a,b])=>`<ellipse cx="${a}" cy="${b}" rx="8" ry="5" fill="#8d8a82"/>`).join('')}
<path d="M-20 0 L20 -10 M-20 -10 L20 0" stroke="#5a3a20" stroke-width="6" stroke-linecap="round"/>
<path d="M-14 -6 Q-18 -30 -4 -46 Q-6 -30 4 -26 Q2 -44 12 -56 Q14 -30 16 -8Z" fill="#f08a24"/><path d="M-6 -6 Q-8 -22 2 -32 Q2 -20 8 -16 Q10 -28 12 -30 Q14 -16 10 -6Z" fill="#ffd24a"/>
<circle cx="4" cy="-74" r="10" fill="#bbb" opacity=".45"/><circle cx="12" cy="-96" r="14" fill="#bbb" opacity=".35"/><circle cx="6" cy="-124" r="18" fill="#bbb" opacity=".25"/></g>`;}
function zelt(x,y,s){return `<g ${tf(x,y,s)}>
<path d="M-8 -116 L-24 -150 M4 -118 L16 -152 M0 -118 L-2 -148" stroke="#5a3e24" stroke-width="4" stroke-linecap="round"/>
<path d="M-74 0 L0 -122 L74 0Z" fill="#8a6a45"/>
<path d="M-74 0 L-30 -50 L-10 0Z" fill="#7a5a3a"/><path d="M30 -50 L74 0 L40 0Z" fill="#9b7b52"/><path d="M-30 -50 L0 -122 L20 -70Z" fill="#94744c"/>
<path d="M-30 -50 L30 -50 M-50 -30 L48 -32 M-14 -100 L14 -98" stroke="#5a3e24" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M-22 0 L0 -52 L22 0Z" fill="#3b2a1c"/>
${[-68,-46,-24,24,46,68].map(a=>`<ellipse cx="${a}" cy="0" rx="9" ry="5" fill="#8d8a82"/>`).join('')}</g>`;}
function langhaus(x,y,s){
  const W=120*s,H=70*s,Lg=310*s,dy=-24*s,R=100*s,o=10*s;
  const top=y-H;let g='';
  g+=`<polygon points="${pts([[x+W,top],[x+W+Lg,top+dy],[x+W+Lg,y+dy],[x+W,y]])}" fill="#b59a6c"/>`;
  let p='';for(let i=0;i<=14;i++){const t=i/14,xx=x+W+Lg*t,yt=top+dy*t,yb=y+dy*t;p+=`M${f1(xx)} ${f1(yt)}L${f1(xx)} ${f1(yb)}`;}

<div class="fakt"><h4>Darüber könnt ihr nachdenken</h4><p>So hart war das Leben in der Altsteinzeit: Schon wenige falsche Entscheidungen konnten gefährlich werden. Welche Entscheidung hat euch am meisten geschadet? Was hättet ihr anders machen können?</p></div>
<div class="aktionen"><button class="btn ocker" id="nochmal">${st.typ==='ereignis'?'Vorherige Entscheidung ändern':'Letzte Entscheidung ändern'}</button><button class="btn hell" id="vorn">Von vorn beginnen</button></div></div>`;
  $('#nochmal').addEventListener('click',()=>{let i=S.i;if(SCHRITTE[i].typ==='ereignis')i--;const v=verlauf[i];Object.assign(S,{n:v.n,w:v.w,g:v.g,wahlen:v.wahlen.slice(),i});werte();schritt();});
  $('#vorn').addEventListener('click',start);
  return true;}
function ende(){
  zeit('fr');window.scrollTo({top:0,behavior:'smooth'});
  const gut=Object.values(S.urteile||{}).filter(v=>v==='gut').length;
  const summe=S.n+S.w+S.g,sterne=summe>=22?3:summe>=14?2:1;
  const FARBE={gut:'#4f7d3a',mittel:'#d39a1e',schlecht:'#b0402e'};
  const rows=SCHRITTE.map((st,i)=>st.typ!=='wahl'?'':`<tr><td><span class="punkt" style="background:${FARBE[S.urteile[i]]}"></span>${st.titel}</td><td>${'ABC'[S.wahlen[i]]}: ${st.opt[S.wahlen[i]].t}</td></tr>`).join('');
  K.innerHTML=`<div class="bild">${SZ.ende()}<span class="chip">🌱 Frühling – ein Jahr ist vorbei</span></div><div class="inhalt">
<h2>Geschafft! Die Rentiere kehren zurück.</h2>
<p>Der Schnee schmilzt, die Herden ziehen wieder heran. Eure Sippe hat ein ganzes Jahr in der Altsteinzeit überlebt.</p>
<div class="urkunde"><h3>Urkunde</h3><div>Die Sippe</div><div class="sippe">${esc(S.name)}</div><div>hat ein Jahr in der Altsteinzeit überlebt.</div>
<div class="sterne">${'★'.repeat(sterne)}${'☆'.repeat(3-sterne)}</div>
<div>${gut} von 10 klugen Entscheidungen · Am Ende: 🍖 ${S.n} · 🔥 ${S.w} · ❤️ ${S.g} · ${new Date().toLocaleDateString('de-DE')}</div>
<ol><li>Die Menschen der Altsteinzeit waren <b>Jäger und Sammler</b>.</li>
<li>Sie lebten als <b>Nomaden</b> und folgten den Tierherden. Sie besaßen nur, was sie tragen konnten.</li>
<li>Vom erlegten Tier wurde <b>alles verwertet</b>: Fleisch, Fell, Knochen, Geweih, Sehnen und Fett.</li>
<li>Das <b>Feuer</b> gab Wärme, Licht und Schutz. Man entfachte es mit Feuerstein, Pyrit und Zunder.</li>
<li>Nur <b>gemeinsam</b> konnte die Gruppe überleben: bei der Jagd, beim Teilen und bei der Pflege von Kranken.</li></ol></div>
<h3 style="font-family:var(--serif);font-weight:normal;margin:20px 0 4px">Rückblick auf eure Entscheidungen</h3>
<table class="tabelle">${rows}</table>
<p style="font-size:.85rem;color:#6b5a45"><span class="punkt" style="background:#4f7d3a"></span>klug <span class="punkt" style="background:#d39a1e;margin-left:10px"></span>geht so <span class="punkt" style="background:#b0402e;margin-left:10px"></span>gefährlich</p>
<div class="aktionen"><button class="btn" id="druck">Urkunde drucken</button><button class="btn hell" id="vorn">Nochmal spielen</button></div></div>`;
  $('#druck').addEventListener('click',()=>{try{window.print();}catch(e){}});
  $('#vorn').addEventListener('click',start);
}
document.addEventListener('keydown',e=>{const k=e.key.toUpperCase();const b=K.querySelectorAll('.opt');
  if(b.length&&'ABC'.includes(k)&&k.length===1){const i='ABC'.indexOf(k);if(b[i])b[i].click();}
  if(e.key==='Enter'){const w=$('#weiter');if(w&&document.activeElement.tagName!=='INPUT')w.click();}});
start();
</script>
